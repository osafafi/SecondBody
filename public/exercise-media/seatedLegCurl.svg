<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Seated Leg Curl</title>
  <desc>A person sits upright in a leg curl machine with the thigh pad snug across the lap and the machine pivot aligned with the knee. The leg begins extended, then the knee bends to draw the ankle roller down and back beneath the seat before returning slowly. The hamstrings and calves glow as the heel curls under.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(-2deg); }
    .upper-arm { transform: rotate(-18deg); }
    .forearm { transform: rotate(-65deg); }
    .thigh { transform: rotate(-85deg); }
    .shin { transform: rotate(0deg); }
    .foot { transform: rotate(20deg); }
    .roller-arm { transform: rotate(-85deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .shin {
        animation: shinCurl 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .foot {
        animation: footCurl 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .roller-arm {
        animation: rollerCurl 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail {
        animation: muscleGlow 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      @keyframes shinCurl {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(105deg); }
        55% { transform: rotate(105deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes footCurl {
        0% { transform: rotate(20deg); }
        42% { transform: rotate(-20deg); }
        55% { transform: rotate(-20deg); }
        100% { transform: rotate(20deg); }
      }
      @keyframes rollerCurl {
        0% { transform: rotate(-85deg); }
        42% { transform: rotate(20deg); }
        55% { transform: rotate(20deg); }
        100% { transform: rotate(-85deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <path d="M 116 352 L 130 236 L 151 236 L 145 352 Z"/>
    <rect x="108" y="232" width="134" height="18" rx="9"/>
    <path d="M 119 235 L 109 125 Q 109 115 119 113 L 133 111 Q 143 111 145 121 L 154 232 Z"/>
    <rect x="104" y="112" width="40" height="125" rx="12" transform="rotate(-5 124 174)"/>
    <path d="M 253 245 L 276 352 L 258 352 L 241 249 Z"/>
    <rect x="228" y="343" width="76" height="9" rx="4"/>
    <circle cx="253" cy="245" r="14"/>
    <circle cx="253" cy="245" r="5" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>
  <g transform="translate(253,245)">
    <g class="segment roller-arm">
      <line x1="0" y1="0" x2="0" y2="84" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round"/>
      <rect x="-20" y="70" width="40" height="25" rx="12" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2"/>
    </g>
  </g>
  <path class="motion-trail" d="M 337 268 Q 326 309 279 332" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 267 336 L 279 323 L 284 338 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g transform="translate(165,237)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment thigh">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <ellipse class="muscle-highlight-primary" cx="-5" cy="43" rx="9" ry="31" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <g transform="translate(0,88)">
        <g class="segment shin">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <ellipse class="muscle-highlight-secondary" cx="-3" cy="42" rx="8" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,84)">
            <g class="segment foot">
              <path d="M -10 -12 L 29 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(165,237)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -24 -20 -27 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 28 -65 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <path d="M 151 219 L 153 200 L 166 201 L 166 218 Z"/>
    <rect x="158" y="207" width="79" height="19" rx="9" transform="rotate(3 197 216)"/>
    <circle cx="253" cy="245" r="7"/>
  </g>
</svg>
