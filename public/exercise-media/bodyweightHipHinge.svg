<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Bodyweight Hip Hinge</title>
  <desc>A person standing in profile with palms against the thighs. They soften the knees, push the hips straight back, and hinge the flat torso forward while sliding the hands to the knees, then drive the hips forward to stand tall.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .body-shift { transform: translateX(0px); }
    .torso { transform: rotate(0deg); }
    .thigh { transform: rotate(2deg); }
    .shin { transform: rotate(-2deg); }
    .upper-arm { transform: rotate(-5deg); }
    .forearm { transform: rotate(5deg); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .body-shift { animation: hipTravel 3s ease-in-out infinite; }
      .torso { animation: torsoHinge 3s ease-in-out infinite; }
      .thigh { animation: thighHinge 3s ease-in-out infinite; }
      .shin { animation: shinHinge 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmHinge 3s ease-in-out infinite; }
      .forearm { animation: forearmHinge 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes hipTravel {
        0% { transform: translateX(0px); }
        42% { transform: translateX(-16px); }
        55% { transform: translateX(-16px); }
        100% { transform: translateX(0px); }
      }

      @keyframes torsoHinge {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(45deg); }
        55% { transform: rotate(45deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes thighHinge {
        0% { transform: rotate(2deg); }
        42% { transform: rotate(-9deg); }
        55% { transform: rotate(-9deg); }
        100% { transform: rotate(2deg); }
      }

      @keyframes shinHinge {
        0% { transform: rotate(-2deg); }
        42% { transform: rotate(9deg); }
        55% { transform: rotate(9deg); }
        100% { transform: rotate(-2deg); }
      }

      @keyframes upperArmHinge {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-28deg); }
        55% { transform: rotate(-28deg); }
        100% { transform: rotate(-5deg); }
      }

      @keyframes forearmHinge {
        0% { transform: rotate(5deg); }
        42% { transform: rotate(-5deg); }
        55% { transform: rotate(-5deg); }
        100% { transform: rotate(5deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <line x1="24" y1="352" x2="376" y2="352" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" />

  <g transform="translate(180,180)">
    <g class="segment body-shift">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14" />
          <ellipse class="muscle-highlight-primary" cx="-7" cy="44" rx="9" ry="31" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />

          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11" />

              <g transform="translate(0,84)">
                <path d="M -10 -12 L 31 -12 Q 40 -12 40 -4 L 40 -1 Q 40 0 32 0 L -10 0 Q -15 0 -15 -6 Z" />
              </g>
            </g>
          </g>
        </g>
      </g>

      <g class="segment torso">
        <rect x="-9" y="-113" width="21" height="25" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
        <ellipse class="muscle-highlight-primary" cx="-10" cy="-4" rx="14" ry="18" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
        <ellipse class="muscle-highlight-secondary" cx="-14" cy="-55" rx="8" ry="30" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />

        <path d="M 3 -150 C 14 -150 23 -141 23 -130 C 23 -125 26 -122 27 -119 C 28 -117 26 -116 23 -116 C 22 -110 14 -106 3 -106 C -9 -106 -17 -115 -17 -128 C -17 -140 -9 -150 3 -150 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

                <g transform="translate(0,62)">
                  <rect x="-8" y="-4" width="16" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
