<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Wall Slides</title>
  <desc>A person stands front-on with their back, head, and arms against a wall. From a goalpost position, they keep the ribs tucked and slide the elbows and wrists upward toward straight overhead, pause, then lower with control.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .left-upper { transform: rotate(90deg); }
    .left-forearm { transform: rotate(90deg); }
    .right-upper { transform: rotate(-90deg); }
    .right-forearm { transform: rotate(-90deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .left-upper {
        animation: leftUpperSlide 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .left-forearm {
        animation: leftForearmSlide 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .right-upper {
        animation: rightUpperSlide 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .right-forearm {
        animation: rightForearmSlide 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .muscle-highlight-primary,
      .muscle-highlight-secondary {
        animation: muscleGlow 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      @keyframes leftUpperSlide {
        0% { transform: rotate(90deg); }
        42% { transform: rotate(165deg); }
        55% { transform: rotate(165deg); }
        100% { transform: rotate(90deg); }
      }
      @keyframes leftForearmSlide {
        0% { transform: rotate(90deg); }
        42% { transform: rotate(5deg); }
        55% { transform: rotate(5deg); }
        100% { transform: rotate(90deg); }
      }
      @keyframes rightUpperSlide {
        0% { transform: rotate(-90deg); }
        42% { transform: rotate(-165deg); }
        55% { transform: rotate(-165deg); }
        100% { transform: rotate(-90deg); }
      }
      @keyframes rightForearmSlide {
        0% { transform: rotate(-90deg); }
        42% { transform: rotate(-5deg); }
        55% { transform: rotate(-5deg); }
        100% { transform: rotate(-90deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <rect x="70" y="42" width="260" height="310" rx="4" opacity="0.22"/>
    <line x1="70" y1="42" x2="70" y2="352"/>
    <line x1="156" y1="42" x2="156" y2="352" opacity="0.55"/>
    <line x1="244" y1="42" x2="244" y2="352" opacity="0.55"/>
    <line x1="330" y1="42" x2="330" y2="352"/>
    <line x1="42" y1="352" x2="358" y2="352" stroke-linecap="round"/>
  </g>
  <g transform="translate(200,223) scale(0.75)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(-12,0)">
      <g transform="rotate(7)">
        <rect x="-14" y="-12" width="28" height="112" rx="14"/>
        <g transform="translate(0,88)">
          <g transform="rotate(-7)">
            <rect x="-11" y="-10" width="22" height="104" rx="11"/>
            <g transform="translate(0,84)">
              <path d="M -11 -10 L 12 -10 Q 19 -10 19 -3 L 19 8 Q 19 12 12 12 L -14 12 Q -18 12 -18 6 L -18 -2 Q -18 -9 -11 -10 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(12,0)">
      <g transform="rotate(-7)">
        <rect x="-14" y="-12" width="28" height="112" rx="14"/>
        <g transform="translate(0,88)">
          <g transform="rotate(7)">
            <rect x="-11" y="-10" width="22" height="104" rx="11"/>
            <g transform="translate(0,84)">
              <path d="M -12 -10 L 11 -10 Q 18 -9 18 -2 L 18 6 Q 18 12 14 12 L -12 12 Q -19 12 -19 8 L -19 -3 Q -19 -10 -12 -10 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(-22,-96)">
      <g class="segment left-upper">
        <rect x="-11" y="-11" width="22" height="89" rx="11"/>
        <ellipse class="muscle-highlight-primary" cx="0" cy="10" rx="9" ry="14" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <g transform="translate(0,67)">
          <g class="segment left-forearm">
            <rect x="-9" y="-9" width="18" height="80" rx="9"/>
            <ellipse cx="0" cy="64" rx="10" ry="12" fill="var(--muscle-body-fill, #1C1934)"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(22,-96)">
      <g class="segment right-upper">
        <rect x="-11" y="-11" width="22" height="89" rx="11"/>
        <ellipse class="muscle-highlight-primary" cx="0" cy="10" rx="9" ry="14" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <g transform="translate(0,67)">
          <g class="segment right-forearm">
            <rect x="-9" y="-9" width="18" height="80" rx="9"/>
            <ellipse cx="0" cy="64" rx="10" ry="12" fill="var(--muscle-body-fill, #1C1934)"/>
          </g>
        </g>
      </g>
    </g>
    <path d="M -18 12 C -26 -20 -28 -70 -24 -91 Q -22 -100 -12 -101 L 12 -101 Q 22 -100 24 -91 C 28 -70 26 -20 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
    <ellipse class="muscle-highlight-primary" cx="-10" cy="-53" rx="10" ry="28" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="10" cy="-53" rx="10" ry="28" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="-22" cy="-87" rx="10" ry="12" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="22" cy="-87" rx="10" ry="12" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-secondary" cx="0" cy="-58" rx="7" ry="32" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
    <ellipse class="muscle-highlight-secondary" cx="0" cy="-91" rx="21" ry="10" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
    <rect x="-9" y="-124" width="18" height="31" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
    <path d="M 0 -162 C 13 -162 22 -153 22 -140 L 22 -132 Q 22 -119 0 -117 Q -22 -119 -22 -132 L -22 -140 C -22 -153 -13 -162 0 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
  </g>
</svg>
