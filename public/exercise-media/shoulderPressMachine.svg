<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Shoulder Press Machine</title>
  <desc>A person sits upright against the back pad of a shoulder press machine. From handles level with the shoulders and elbows bent below the hands, they press overhead until the elbows are nearly straight, pause, then lower under control without arching or shrugging.</desc>
  <style>
    .segment,
    .press-link,
    .press-handle {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(0deg); }
    .upper-arm { transform: rotate(-35deg); }
    .forearm { transform: rotate(-135deg); }
    .press-link { transform: rotate(-122deg) scaleY(0.885); }
    .press-handle { transform: translateY(110px); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .upper-arm {
        animation: upperArmPress 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .forearm {
        animation: forearmPress 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .press-link {
        animation: linkagePress 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .press-handle {
        animation: handlePress 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .muscle-highlight-primary,
      .muscle-highlight-secondary {
        animation: muscleGlow 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      .motion-trail {
        animation: trailPulse 3s ease-in-out infinite;
        animation-iteration-count: infinite;
      }
      @keyframes upperArmPress {
        0% { transform: rotate(-35deg); }
        42% { transform: rotate(-145deg); }
        55% { transform: rotate(-145deg); }
        100% { transform: rotate(-35deg); }
      }
      @keyframes forearmPress {
        0% { transform: rotate(-135deg); }
        42% { transform: rotate(-25deg); }
        55% { transform: rotate(-25deg); }
        100% { transform: rotate(-135deg); }
      }
      @keyframes linkagePress {
        0% { transform: rotate(-122deg) scaleY(0.885); }
        42% { transform: rotate(-50deg) scaleY(0.98); }
        55% { transform: rotate(-50deg) scaleY(0.98); }
        100% { transform: rotate(-122deg) scaleY(0.885); }
      }
      @keyframes handlePress {
        0% { transform: translateY(110px); }
        42% { transform: translateY(0px); }
        55% { transform: translateY(0px); }
        100% { transform: translateY(110px); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
      @keyframes trailPulse {
        0% { opacity: 0.2; }
        42% { opacity: 0.55; }
        55% { opacity: 0.55; }
        100% { opacity: 0.2; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="302" y="76" width="24" height="276" rx="7"/>
    <rect x="254" y="343" width="96" height="9" rx="4"/>
    <rect x="117" y="343" width="107" height="9" rx="4"/>
    <rect x="138" y="247" width="96" height="18" rx="9"/>
    <rect x="148" y="151" width="18" height="101" rx="8"/>
    <rect x="143" y="260" width="27" height="92" rx="6"/>
    <circle cx="304" cy="103" r="13"/>
    <circle cx="304" cy="103" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>

  <g transform="translate(178,255)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-78)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(56)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(304,103)">
    <g class="press-link">
      <line x1="0" y1="0" x2="0" y2="-100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <g class="press-handle" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <rect x="218" y="24" width="10" height="32" rx="5"/>
    <rect x="230" y="24" width="10" height="32" rx="5"/>
    <rect x="218" y="34" width="22" height="12" rx="5"/>
  </g>

  <path class="motion-trail" d="M 251 154 Q 259 106 243 66" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 240 55 L 252 70 L 237 72 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(178,255)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -24 -20 -25 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 27 -66 24 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-secondary" cx="-2" cy="-85" rx="13" ry="10" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-primary" cx="1" cy="7" rx="12" ry="15" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-2" cy="38" rx="7" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,62)">
                <ellipse cx="0" cy="0" rx="10" ry="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
