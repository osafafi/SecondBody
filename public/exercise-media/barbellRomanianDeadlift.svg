<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Barbell Romanian Deadlift</title>
  <desc>A person stands in profile holding a barbell against the thighs with softly bent knees. They push the hips back, keep a flat back, and slide the bar down the legs to just below the knees before driving the hips forward to stand.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .hip-shift { transform: translate(0, 0); }
    .torso { transform: rotate(0deg); }
    .thigh { transform: rotate(-4deg); }
    .shin { transform: rotate(8deg); }
    .foot { transform: rotate(-4deg); }
    .upper-arm { transform: rotate(-4deg); }
    .forearm { transform: rotate(4deg); }
    .barbell { transform: rotate(0deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .hip-shift { animation: hipHinge 3s ease-in-out infinite; }
      .torso { animation: torsoHinge 3s ease-in-out infinite; }
      .thigh { animation: thighHinge 3s ease-in-out infinite; }
      .shin { animation: shinHinge 3s ease-in-out infinite; }
      .foot { animation: footHinge 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmHinge 3s ease-in-out infinite; }
      .forearm { animation: forearmHinge 3s ease-in-out infinite; }
      .barbell { animation: barbellLevel 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes hipHinge {
        0% { transform: translate(0, 0); }
        42% { transform: translate(-28px, 0); }
        55% { transform: translate(-28px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes torsoHinge {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(60deg); }
        55% { transform: rotate(60deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes thighHinge {
        0% { transform: rotate(-4deg); }
        42% { transform: rotate(-14deg); }
        55% { transform: rotate(-14deg); }
        100% { transform: rotate(-4deg); }
      }
      @keyframes shinHinge {
        0% { transform: rotate(8deg); }
        42% { transform: rotate(9.5deg); }
        55% { transform: rotate(9.5deg); }
        100% { transform: rotate(8deg); }
      }
      @keyframes footHinge {
        0% { transform: rotate(-4deg); }
        42% { transform: rotate(4.5deg); }
        55% { transform: rotate(4.5deg); }
        100% { transform: rotate(-4deg); }
      }
      @keyframes upperArmHinge {
        0% { transform: rotate(-4deg); }
        42% { transform: rotate(-44deg); }
        55% { transform: rotate(-44deg); }
        100% { transform: rotate(-4deg); }
      }
      @keyframes forearmHinge {
        0% { transform: rotate(4deg); }
        42% { transform: rotate(0deg); }
        55% { transform: rotate(0deg); }
        100% { transform: rotate(4deg); }
      }
      @keyframes barbellLevel {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-16deg); }
        55% { transform: rotate(-16deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>

  <path class="motion-trail" d="M 218 113 Q 262 122 282 161" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 286 171 L 273 160 L 289 156 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(210,202)">
    <g transform="scale(0.82)">
      <g class="segment hip-shift">
        <g class="segment thigh" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <ellipse class="muscle-highlight-primary" cx="-7" cy="43" rx="9" ry="32" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -10 -11 L 29 -11 Q 40 -11 40 -2 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>

        <g class="segment torso">
          <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-primary" cx="-13" cy="-4" rx="16" ry="17" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-13" cy="-57" rx="9" ry="31" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-8" cy="-82" rx="12" ry="14" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

          <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

          <g transform="translate(0,-96)">
            <g class="segment upper-arm">
              <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,67)">
                <g class="segment forearm">
                  <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                  <ellipse class="muscle-highlight-secondary" cx="0" cy="31" rx="7" ry="22" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
                  <g transform="translate(0,62)">
                    <circle cx="0" cy="0" r="10" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
                    <g class="segment barbell" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
                      <line x1="-48" y1="0" x2="55" y2="0" stroke-linecap="round"/>
                      <rect x="-13" y="-4" width="26" height="8" rx="4"/>
                      <circle cx="48" cy="0" r="16"/>
                      <circle cx="48" cy="0" r="5" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
