<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Cable Face Pull</title>
  <desc>A person stands facing a cable pulley set at face height. They begin with the arm extended toward the rope, then pull it to the forehead while keeping the elbow high and splitting the rope ends apart, pause briefly, and return with control. The rear shoulder and mid back light up during the pull.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(2deg); }
    .upper-arm { transform: rotate(-122deg); }
    .forearm { transform: rotate(32deg); }
    .cable { transform: rotate(84deg) scaleY(0.74); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmFacePull 3s ease-in-out infinite; }
      .forearm { animation: forearmFacePull 3s ease-in-out infinite; }
      .cable { animation: cableFacePull 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes upperArmFacePull {
        0% { transform: rotate(-122deg); }
        42% { transform: rotate(-90deg); }
        55% { transform: rotate(-90deg); }
        100% { transform: rotate(-122deg); }
      }
      @keyframes forearmFacePull {
        0% { transform: rotate(32deg); }
        42% { transform: rotate(-133deg); }
        55% { transform: rotate(-133deg); }
        100% { transform: rotate(32deg); }
      }
      @keyframes cableFacePull {
        0% { transform: rotate(84deg) scaleY(0.74); }
        42% { transform: rotate(91deg) scaleY(1.72); }
        55% { transform: rotate(91deg) scaleY(1.72); }
        100% { transform: rotate(84deg) scaleY(0.74); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="330" y="34" width="25" height="318" rx="7"/>
    <rect x="305" y="343" width="72" height="9" rx="4"/>
    <rect x="321" y="51" width="43" height="38" rx="7"/>
    <circle cx="342" cy="72" r="13"/>
    <circle cx="342" cy="72" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>

  <g transform="translate(145,205)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-18)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(-32)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <g transform="rotate(-40)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(342,72)">
    <g class="segment cable">
      <line x1="0" y1="0" x2="0" y2="100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <path class="motion-trail" d="M 276 64 Q 233 55 190 64" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 179 67 L 194 56 L 194 72 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(145,205)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-13" cy="-55" rx="11" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="2" cy="-87" rx="15" ry="9" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-primary" cx="0" cy="17" rx="9" ry="17" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <ellipse class="muscle-highlight-secondary" cx="0" cy="35" rx="7" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
              <g transform="translate(0,62)" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="0" cy="0" r="5" fill="var(--muscle-equipment-fill, #241F42)"/>
                <path d="M 0 0 Q 9 8 18 5"/>
                <path d="M 0 0 Q -9 8 -18 5"/>
                <circle cx="20" cy="5" r="3" fill="var(--muscle-equipment-fill, #241F42)"/>
                <circle cx="-20" cy="5" r="3" fill="var(--muscle-equipment-fill, #241F42)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
