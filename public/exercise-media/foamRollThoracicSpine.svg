<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Foam Roll Thoracic Spine</title>
  <desc>A person lies on their back in profile with their hips lifted, feet planted, and hands supporting the head. A foam roller rests beneath the upper back as the body slowly shifts so the roller travels from below the shoulder blades toward their top, then returns without rolling onto the lower back.</desc>
  <style>
    .segment,
    .body-shift,
    .roller,
    .foot {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .body-shift { transform: translate(0, 0); }
    .torso { transform: rotate(-90deg); }
    .upper-arm { transform: rotate(-50deg); }
    .forearm { transform: rotate(160deg); }
    .thigh { transform: rotate(62deg); }
    .shin { transform: rotate(-62deg); }
    .foot { transform: rotate(0deg); }
    .roller { transform: rotate(0deg); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    .motion-trail { opacity: 0.5; }

    @media (prefers-reduced-motion: no-preference) {
      .body-shift { animation: bodyRoll 3s ease-in-out infinite; }
      .thigh { animation: thighRoll 3s ease-in-out infinite; }
      .shin { animation: shinRoll 3s ease-in-out infinite; }
      .foot { animation: footRoll 3s ease-in-out infinite; }
      .roller { animation: rollerTurn 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes bodyRoll {
        0% { transform: translate(0, 0); }
        42% { transform: translate(-24px, 0); }
        55% { transform: translate(-24px, 0); }
        100% { transform: translate(0, 0); }
      }

      @keyframes thighRoll {
        0% { transform: rotate(62deg); }
        42% { transform: rotate(60deg); }
        55% { transform: rotate(60deg); }
        100% { transform: rotate(62deg); }
      }

      @keyframes shinRoll {
        0% { transform: rotate(-62deg); }
        42% { transform: rotate(-75deg); }
        55% { transform: rotate(-75deg); }
        100% { transform: rotate(-62deg); }
      }

      @keyframes footRoll {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(15deg); }
        55% { transform: rotate(15deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes rollerTurn {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-55deg); }
        55% { transform: rotate(-55deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <rect x="34" y="348" width="332" height="4" rx="2"/>
    <g transform="translate(218,260)">
      <g class="roller">
        <circle cx="0" cy="0" r="22"/>
        <path d="M -15 -16 Q 0 -7 15 -16" fill="none" stroke-linecap="round"/>
        <path d="M -19 11 Q 0 3 19 11" fill="none" stroke-linecap="round"/>
        <line x1="-5" y1="-21" x2="8" y2="20" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <path class="motion-trail" d="M 151 286 Q 136 290 116 286" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 107 286 L 122 279 L 121 293 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(140,216)">
    <g class="body-shift">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>
              <g transform="translate(0,84)">
                <g class="foot">
                  <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>

      <g class="segment torso">
        <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <ellipse class="muscle-highlight-primary" cx="-14" cy="-68" rx="7" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="-10" cy="-48" rx="12" ry="22" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                <g transform="translate(0,62)">
                  <ellipse cx="0" cy="3" rx="11" ry="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
