<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Chest-Supported Dumbbell Row</title>
  <desc>A person lies face down on a bench inclined about thirty degrees, chest pinned to the pad. The dumbbells begin hanging below the shoulders, then rise toward the ribs as the elbow leads back and the shoulder blades squeeze together before a slow return.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(60deg); }
    .upper-arm { transform: rotate(-60deg); }
    .forearm { transform: rotate(0deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmRow 3s ease-in-out infinite; }
      .forearm { animation: forearmRow 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes upperArmRow {
        0% { transform: rotate(-60deg); }
        42% { transform: rotate(62deg); }
        55% { transform: rotate(62deg); }
        100% { transform: rotate(-60deg); }
      }
      @keyframes forearmRow {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-112deg); }
        55% { transform: rotate(-112deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <path d="M 73 257 L 266 146 Q 272 143 276 150 L 282 160 Q 285 166 278 170 L 84 282 Q 78 285 74 278 L 69 268 Q 66 262 73 257 Z"/>
    <path d="M 180 222 L 195 222 L 223 352 L 207 352 Z"/>
    <path d="M 108 276 L 123 270 L 91 352 L 74 352 Z"/>
    <rect x="59" y="344" width="48" height="8" rx="4"/>
    <rect x="197" y="344" width="45" height="8" rx="4"/>
    <circle cx="187" cy="226" r="7" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>

  <path class="motion-trail" d="M 207 310 Q 184 260 151 220" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 143 210 L 158 217 L 147 227 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(122,236)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(62)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(-90)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <g transform="rotate(-62)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(122,236)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-13" cy="-56" rx="11" ry="31" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-primary" cx="2" cy="-48" rx="9" ry="27" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="7" rx="9" ry="13" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="34" rx="8" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <ellipse class="muscle-highlight-secondary" cx="0" cy="31" rx="7" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

              <g transform="translate(0,62)" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
                <rect x="-24" y="-5" width="48" height="10" rx="5"/>
                <rect x="-31" y="-13" width="9" height="26" rx="3"/>
                <rect x="22" y="-13" width="9" height="26" rx="3"/>
                <g transform="translate(8,8)">
                  <rect x="-24" y="-5" width="48" height="10" rx="5"/>
                  <rect x="-31" y="-13" width="9" height="26" rx="3"/>
                  <rect x="22" y="-13" width="9" height="26" rx="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
