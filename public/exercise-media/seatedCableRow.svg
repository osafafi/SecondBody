<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Low Row, Neutral Grip</title>
  <desc>A person sits tall at a low cable row with feet braced and arms extended, then draws the shoulder blade back and down before bending the elbow to pull a neutral-grip handle to the navel. The mid back and lats glow as the elbow passes the ribs, followed by a brief hold and a slow return.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(6deg); }
    .upper-arm { transform: rotate(-60deg); }
    .forearm { transform: rotate(12deg); }
    .cable { transform: rotate(-56deg) scaleY(1.16); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .torso { animation: torsoRow 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmRow 3s ease-in-out infinite; }
      .forearm { animation: forearmRow 3s ease-in-out infinite; }
      .cable { animation: cableRow 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes torsoRow {
        0% { transform: rotate(6deg); }
        42% { transform: rotate(-4deg); }
        55% { transform: rotate(-4deg); }
        100% { transform: rotate(6deg); }
      }
      @keyframes upperArmRow {
        0% { transform: rotate(-60deg); }
        18% { transform: rotate(-54deg); }
        42% { transform: rotate(16deg); }
        55% { transform: rotate(16deg); }
        100% { transform: rotate(-60deg); }
      }
      @keyframes forearmRow {
        0% { transform: rotate(12deg); }
        18% { transform: rotate(8deg); }
        42% { transform: rotate(-102deg); }
        55% { transform: rotate(-102deg); }
        100% { transform: rotate(12deg); }
      }
      @keyframes cableRow {
        0% { transform: rotate(-56deg) scaleY(1.16); }
        18% { transform: rotate(-57deg) scaleY(1.22); }
        42% { transform: rotate(-62deg) scaleY(1.81); }
        55% { transform: rotate(-62deg) scaleY(1.81); }
        100% { transform: rotate(-56deg) scaleY(1.16); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        18% { opacity: 0.48; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="330" y="146" width="24" height="206" rx="7"/>
    <rect x="258" y="343" width="70" height="9" rx="4"/>
    <path d="M258 343 L283 292 L298 297 L276 343 Z"/>
    <rect x="124" y="268" width="30" height="84" rx="6"/>
    <rect x="78" y="252" width="126" height="18" rx="9"/>
    <circle cx="342" cy="300" r="13"/>
    <circle cx="342" cy="300" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>
  <g transform="translate(140,246)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-78)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(42)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <g transform="rotate(31)">
              <path d="M-10-12 L30-12 Q40-12 40-3 L40 5 Q40 11 31 11 L-10 11 Q-15 11-15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(342,300)">
    <g class="segment cable">
      <line x1="0" y1="0" x2="0" y2="-100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>
  <path class="motion-trail" d="M246 235 Q222 229 200 221" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M189 219 L205 214 L203 227 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g transform="translate(140,246)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-18 12 C-26-20-28-70-22-92 Q-19-99-10-99 L13-99 Q23-99 25-91 C29-66 25-18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-13" cy="-58" rx="11" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-primary" cx="4" cy="-53" rx="9" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="8" cy="-86" rx="11" ry="10" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M3-162 C14-162 23-153 23-142 C23-137 26-134 27-131 C28-129 26-128 23-128 C22-122 14-118 3-118 C-9-118-17-127-17-140 C-17-152-9-162 3-162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="26" rx="8" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <ellipse class="muscle-highlight-secondary" cx="0" cy="28" rx="6" ry="19" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
              <g transform="translate(0,62)">
                <rect x="-15" y="-6" width="30" height="12" rx="6" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
