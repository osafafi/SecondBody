<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Split Squat</title>
  <desc>A person stands upright in a long split stance with the front foot flat and the back heel raised. They lower straight down until the back knee is just above the floor, pause, then drive through the front heel to stand.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .body-lift { transform: translateY(0); }
    .front-thigh { transform: rotate(-52.9deg); }
    .front-shin { transform: rotate(49.6deg); }
    .front-foot { transform: rotate(3.3deg); }
    .back-thigh { transform: rotate(20.8deg); }
    .back-shin { transform: rotate(28.6deg); }
    .back-foot { transform: rotate(-49.4deg); }
    .upper-arm { transform: rotate(4deg); }
    .forearm { transform: rotate(-4deg); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .body-lift { animation: bodyDrop 3s ease-in-out infinite; }
      .front-thigh { animation: frontThighMove 3s ease-in-out infinite; }
      .front-shin { animation: frontShinMove 3s ease-in-out infinite; }
      .front-foot { animation: frontFootMove 3s ease-in-out infinite; }
      .back-thigh { animation: backThighMove 3s ease-in-out infinite; }
      .back-shin { animation: backShinMove 3s ease-in-out infinite; }
      .back-foot { animation: backFootMove 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes bodyDrop {
        0% { transform: translateY(0); }
        42% { transform: translateY(46px); }
        55% { transform: translateY(46px); }
        100% { transform: translateY(0); }
      }

      @keyframes frontThighMove {
        0% { transform: rotate(-52.9deg); }
        42% { transform: rotate(-84.8deg); }
        55% { transform: rotate(-84.8deg); }
        100% { transform: rotate(-52.9deg); }
      }

      @keyframes frontShinMove {
        0% { transform: rotate(49.6deg); }
        42% { transform: rotate(93.4deg); }
        55% { transform: rotate(93.4deg); }
        100% { transform: rotate(49.6deg); }
      }

      @keyframes frontFootMove {
        0% { transform: rotate(3.3deg); }
        42% { transform: rotate(-8.6deg); }
        55% { transform: rotate(-8.6deg); }
        100% { transform: rotate(3.3deg); }
      }

      @keyframes backThighMove {
        0% { transform: rotate(20.8deg); }
        42% { transform: rotate(7.2deg); }
        55% { transform: rotate(7.2deg); }
        100% { transform: rotate(20.8deg); }
      }

      @keyframes backShinMove {
        0% { transform: rotate(28.6deg); }
        42% { transform: rotate(80.1deg); }
        55% { transform: rotate(80.1deg); }
        100% { transform: rotate(28.6deg); }
      }

      @keyframes backFootMove {
        0% { transform: rotate(-49.4deg); }
        42% { transform: rotate(-87.3deg); }
        55% { transform: rotate(-87.3deg); }
        100% { transform: rotate(-49.4deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <line x1="24" y1="352" x2="376" y2="352" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" />

  <g transform="translate(200,200)">
    <g class="segment body-lift">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment back-thigh">
          <rect x="-14" y="-12" width="28" height="112" rx="14" />
          <ellipse class="muscle-highlight-secondary" cx="7" cy="40" rx="8" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />
          <g transform="translate(0,88)">
            <g class="segment back-shin">
              <rect x="-11" y="-10" width="22" height="104" rx="11" />
              <g transform="translate(0,84)">
                <g class="segment back-foot">
                  <path d="M 8 -10 L 8 4 Q 4 10 -4 11 L -34 13 Q -41 13 -41 7 Q -41 3 -34 0 L -8 -11 Z" />
                </g>
              </g>
            </g>
          </g>
        </g>

        <g class="segment front-thigh">
          <rect x="-14" y="-12" width="28" height="112" rx="14" />
          <ellipse class="muscle-highlight-primary" cx="-5" cy="38" rx="10" ry="27" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
          <ellipse class="muscle-highlight-secondary" cx="7" cy="55" rx="6" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />
          <g transform="translate(0,88)">
            <g class="segment front-shin">
              <rect x="-11" y="-10" width="22" height="104" rx="11" />
              <g transform="translate(0,84)">
                <g class="segment front-foot">
                  <path d="M -10 -11 L 9 -11 L 39 0 Q 44 3 42 8 Q 40 12 32 12 L -10 12 Q -15 12 -15 2 Z" />
                </g>
              </g>
            </g>
          </g>
        </g>

        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" />
        <ellipse class="muscle-highlight-primary" cx="-13" cy="-3" rx="12" ry="14" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
        <ellipse class="muscle-highlight-secondary" cx="11" cy="-53" rx="8" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />

        <rect x="-9" y="-124" width="21" height="34" rx="8" />
        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" />

        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" />
            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" />
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
