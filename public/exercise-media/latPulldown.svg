<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Lat Pulldown, Neutral Grip</title>
  <desc>A person sits facing right at a lat pulldown machine with the thighs secured beneath a restraint pad. From a full overhead reach, they keep the chest lifted and lean back only slightly while driving the elbow down beside the ribs to bring the neutral-grip attachment to the upper chest, pause, then return slowly to a complete stretch.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(-5deg); }
    .upper-arm { transform: rotate(-150deg); }
    .forearm { transform: rotate(5deg); }
    .cable { transform: rotate(75deg) scaleY(0.46); }
    .attachment { transform: translate(226px,64px); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .torso { animation: torsoPulldown 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmPulldown 3s ease-in-out infinite; }
      .forearm { animation: forearmPulldown 3s ease-in-out infinite; }
      .cable { animation: cablePulldown 3s ease-in-out infinite; }
      .attachment { animation: attachmentPulldown 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes torsoPulldown {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-7deg); }
        55% { transform: rotate(-7deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes upperArmPulldown {
        0% { transform: rotate(-150deg); }
        42% { transform: rotate(-5deg); }
        55% { transform: rotate(-5deg); }
        100% { transform: rotate(-150deg); }
      }
      @keyframes forearmPulldown {
        0% { transform: rotate(5deg); }
        42% { transform: rotate(-153deg); }
        55% { transform: rotate(-153deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes cablePulldown {
        0% { transform: rotate(75deg) scaleY(0.46); }
        42% { transform: rotate(36deg) scaleY(1.53); }
        55% { transform: rotate(36deg) scaleY(1.53); }
        100% { transform: rotate(75deg) scaleY(0.46); }
      }
      @keyframes attachmentPulldown {
        0% { transform: translate(226px,64px); }
        42% { transform: translate(193px,184px); }
        55% { transform: translate(193px,184px); }
        100% { transform: translate(226px,64px); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="318" y="38" width="25" height="314" rx="7"/>
    <rect x="218" y="38" width="112" height="14" rx="7"/>
    <rect x="307" y="343" width="48" height="9" rx="4"/>
    <circle cx="270" cy="52" r="13"/>
    <circle cx="270" cy="52" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
    <rect x="142" y="280" width="83" height="17" rx="8"/>
    <rect x="163" y="295" width="20" height="57" rx="6"/>
    <rect x="128" y="343" width="91" height="9" rx="4"/>
    <rect x="204" y="241" width="68" height="17" rx="8"/>
    <rect x="256" y="231" width="13" height="29" rx="6"/>
  </g>

  <g transform="translate(175,274)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-82)">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(76)">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <g transform="translate(0,84)">
            <g transform="rotate(-76)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(270,52)">
    <g class="segment cable">
      <line x1="0" y1="0" x2="0" y2="100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <path class="motion-trail" d="M 237 88 Q 219 127 203 168" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 198 179 L 196 161 L 210 168 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(175,274)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-13" cy="-51" rx="11" ry="34" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="1" cy="-70" rx="10" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="8" rx="9" ry="13" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="39" rx="8" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <ellipse class="muscle-highlight-secondary" cx="0" cy="31" rx="7" ry="19" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g class="attachment" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <rect x="-18" y="-5" width="36" height="10" rx="5"/>
    <rect x="-18" y="-3" width="8" height="23" rx="4"/>
    <rect x="10" y="-3" width="8" height="23" rx="4"/>
  </g>
</svg>
