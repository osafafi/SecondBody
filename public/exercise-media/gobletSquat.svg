<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Goblet Squat</title>
  <desc>A person in profile holds one dumbbell vertically against the chest with the elbows tucked. They sit down between the hips until the thigh reaches parallel while keeping the torso upright and foot planted, pause at depth, then stand smoothly. The quadriceps and glutes glow most strongly at the bottom.</desc>
  <style>
    .segment,
    .body-root {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .body-root { transform: translate(0px, 0px); }
    .torso { transform: rotate(3deg); }
    .thigh { transform: rotate(-10deg); }
    .shin { transform: rotate(10deg); }
    .foot { transform: rotate(0deg); }
    .upper-arm { transform: rotate(-8deg); }
    .forearm { transform: rotate(-156deg); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .body-root { animation: squatBody 3s ease-in-out infinite; }
      .torso { animation: squatTorso 3s ease-in-out infinite; }
      .thigh { animation: squatThigh 3s ease-in-out infinite; }
      .shin { animation: squatShin 3s ease-in-out infinite; }
      .foot { animation: squatFoot 3s ease-in-out infinite; }
      .upper-arm { animation: squatUpperArm 3s ease-in-out infinite; }
      .forearm { animation: squatForearm 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes squatBody {
        0% { transform: translate(0px, 0px); }
        42% { transform: translate(-44px, 77px); }
        55% { transform: translate(-44px, 77px); }
        100% { transform: translate(0px, 0px); }
      }

      @keyframes squatTorso {
        0% { transform: rotate(3deg); }
        42% { transform: rotate(8deg); }
        55% { transform: rotate(8deg); }
        100% { transform: rotate(3deg); }
      }

      @keyframes squatThigh {
        0% { transform: rotate(-10deg); }
        42% { transform: rotate(-78deg); }
        55% { transform: rotate(-78deg); }
        100% { transform: rotate(-10deg); }
      }

      @keyframes squatShin {
        0% { transform: rotate(10deg); }
        42% { transform: rotate(103deg); }
        55% { transform: rotate(103deg); }
        100% { transform: rotate(10deg); }
      }

      @keyframes squatFoot {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-25deg); }
        55% { transform: rotate(-25deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes squatUpperArm {
        0% { transform: rotate(-8deg); }
        42% { transform: rotate(-12deg); }
        55% { transform: rotate(-12deg); }
        100% { transform: rotate(-8deg); }
      }

      @keyframes squatForearm {
        0% { transform: rotate(-156deg); }
        42% { transform: rotate(-152deg); }
        55% { transform: rotate(-152deg); }
        100% { transform: rotate(-156deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>

  <g transform="translate(190,211) scale(0.82)">
    <g class="body-root">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <ellipse class="muscle-highlight-primary" cx="1" cy="35" rx="11" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-4" cy="66" rx="7" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>

              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -11 -12 L 29 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 30 11 L -11 11 Q -16 11 -16 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>

      <g class="segment torso">
        <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <ellipse class="muscle-highlight-primary" cx="-15" cy="-3" rx="14" ry="17" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="12" cy="-53" rx="8" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="-15" cy="-55" rx="7" ry="27" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="0" cy="62" r="10" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>

        <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
          <rect x="24" y="-101" width="10" height="35" rx="4"/>
          <rect x="16" y="-106" width="26" height="9" rx="4"/>
          <rect x="16" y="-70" width="26" height="9" rx="4"/>
        </g>
      </g>
    </g>
  </g>
</svg>
