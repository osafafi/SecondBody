name: CI

# Runs on every pull request and on every push to a feature branch.
# Deployment lives in a separate workflow (added in milestone M9) so that a
# failing check can never ship anything.

on:
  pull_request:
  push:
    branches-ignore:
      - main

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The generator that produces these files is added in M3. Until then there is
      # nothing to validate, so the step skips itself rather than failing the build.
      - name: Validate exercise animations
        run: |
          if [ -f tools/exercise-media/validateExerciseSvg.mjs ]; then
            node tools/exercise-media/validateExerciseSvg.mjs
          else
            echo "No exercise media validator yet (arrives in M3). Skipping."
          fi

      - name: Build
        run: npm run build
