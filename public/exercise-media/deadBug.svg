<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Dead Bug</title>
  <desc>A person lies on their back on a mat with the lower back pressed flat, arms raised and knees over the hips. One arm slowly reaches overhead as the opposite leg extends low, then both return to the start position.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(90deg); }
    .upper-arm { transform: rotate(90deg); }
    .forearm { transform: rotate(0deg); }
    .thigh { transform: rotate(180deg); }
    .shin { transform: rotate(-90deg); }
    .foot { transform: rotate(90deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmDeadBug 3s ease-in-out infinite; }
      .forearm { animation: forearmDeadBug 3s ease-in-out infinite; }
      .thigh { animation: thighDeadBug 3s ease-in-out infinite; }
      .shin { animation: shinDeadBug 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes upperArmDeadBug {
        0% { transform: rotate(90deg); }
        42% { transform: rotate(190deg); }
        55% { transform: rotate(190deg); }
        100% { transform: rotate(90deg); }
      }
      @keyframes forearmDeadBug {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(20deg); }
        55% { transform: rotate(20deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes thighDeadBug {
        0% { transform: rotate(180deg); }
        42% { transform: rotate(80deg); }
        55% { transform: rotate(80deg); }
        100% { transform: rotate(180deg); }
      }
      @keyframes shinDeadBug {
        0% { transform: rotate(-90deg); }
        42% { transform: rotate(5deg); }
        55% { transform: rotate(5deg); }
        100% { transform: rotate(-90deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="28" y="343" width="344" height="9" rx="4"/>
  </g>
  <path class="motion-trail" d="M 256 215 Q 320 224 363 278" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 356 268 L 366 283 L 349 279 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <path class="motion-trail" d="M 137 231 Q 70 263 39 322" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 39 310 L 36 328 L 51 317 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g transform="translate(176,317)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <ellipse class="muscle-highlight-secondary" cx="0" cy="20" rx="10" ry="19" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <g transform="translate(0,88)">
        <g class="segment shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <g transform="translate(0,84)">
            <g class="segment foot">
              <path d="M -10 -9 L 10 -9 Q 14 -9 15 -4 L 18 28 Q 19 39 9 42 L 1 42 Q -8 41 -10 32 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(176,317)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="7" cy="-43" rx="13" ry="28" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="-12" cy="-55" rx="8" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <g transform="translate(0,-140)">
        <g transform="rotate(-90)">
          <path d="M -5 -22 C 7 -22 16 -14 16 -4 C 16 1 21 3 22 6 C 23 8 20 9 17 9 C 16 17 8 22 -4 22 C -16 22 -23 12 -23 -1 C -23 -13 -16 -22 -5 -22 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,62)">
                <ellipse cx="0" cy="7" rx="8" ry="13" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
