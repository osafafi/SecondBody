<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Goblet Squat to Bench</title>
  <desc>A person stands just in front of a flat bench, facing right and holding one dumbbell vertically against the chest. They keep the chest lifted and heels planted while sitting back and down until the hips lightly touch the bench, pause without sitting, then stand straight back up. The quadriceps and glutes glow as the person rises.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .rig rect,
    .rig path,
    .rig circle,
    .rig ellipse {
      vector-effect: non-scaling-stroke;
    }
    .hip { transform: translate(260px,170px); }
    .torso { transform: rotate(1deg); }
    .thigh { transform: rotate(-5deg); }
    .shin { transform: rotate(10deg); }
    .foot { transform: rotate(-5deg); }
    .upper-arm { transform: rotate(-28deg); }
    .forearm { transform: rotate(190deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .hip { animation: hipSquat 3s ease-in-out infinite; }
      .torso { animation: torsoSquat 3s ease-in-out infinite; }
      .thigh { animation: thighSquat 3s ease-in-out infinite; }
      .shin { animation: shinSquat 3s ease-in-out infinite; }
      .foot { animation: footSquat 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes hipSquat {
        0% { transform: translate(260px,170px); }
        42% { transform: translate(205px,225px); }
        55% { transform: translate(205px,225px); }
        100% { transform: translate(260px,170px); }
      }
      @keyframes torsoSquat {
        0% { transform: rotate(1deg); }
        42% { transform: rotate(8deg); }
        55% { transform: rotate(8deg); }
        100% { transform: rotate(1deg); }
      }
      @keyframes thighSquat {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-65deg); }
        55% { transform: rotate(-65deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes shinSquat {
        0% { transform: rotate(10deg); }
        42% { transform: rotate(84deg); }
        55% { transform: rotate(84deg); }
        100% { transform: rotate(10deg); }
      }
      @keyframes footSquat {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-19deg); }
        55% { transform: rotate(-19deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="65" y="256" width="142" height="18" rx="9"/>
    <path d="M 84 273 L 100 273 L 96 352 L 77 352 Z"/>
    <path d="M 174 273 L 190 273 L 199 352 L 180 352 Z"/>
  </g>
  <g class="rig" transform="translate(15,49) scale(0.86)">
    <g class="segment hip">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <ellipse class="muscle-highlight-primary" cx="5" cy="38" rx="10" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-7" cy="53" rx="5" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g class="segment torso">
        <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <ellipse class="muscle-highlight-primary" cx="-13" cy="-1" rx="17" ry="18" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="13" cy="-53" rx="7" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="-15" cy="-57" rx="6" ry="27" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                <g transform="translate(0,62)">
                  <circle cx="0" cy="0" r="10" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
        <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
          <rect x="17" y="-95" width="10" height="35" rx="4"/>
          <rect x="8" y="-105" width="28" height="13" rx="4"/>
          <rect x="8" y="-63" width="28" height="13" rx="4"/>
          <circle cx="13" cy="-92" r="7" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
        </g>
      </g>
    </g>
  </g>
</svg>
