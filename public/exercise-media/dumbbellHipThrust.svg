<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Dumbbell Hip Thrust</title>
  <desc>A person in profile with their shoulder blades against a flat bench, feet planted, and a dumbbell held across the hip crease. They drive through the heels to raise the hips level with the knees, squeeze the glutes for a beat, then lower under control.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .hip-rise { transform: translate(195px,304px); }
    .torso { transform: rotate(-50deg); }
    .thigh { transform: rotate(122deg); }
    .shin { transform: rotate(-104deg); }
    .foot { transform: rotate(-18deg); }
    .upper-arm { transform: rotate(61deg); }
    .forearm { transform: rotate(92deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .hip-rise { animation: hipRise 3s ease-in-out infinite; }
      .torso { animation: torsoThrust 3s ease-in-out infinite; }
      .thigh { animation: thighThrust 3s ease-in-out infinite; }
      .shin { animation: shinThrust 3s ease-in-out infinite; }
      .foot { animation: footThrust 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmThrust 3s ease-in-out infinite; }
      .forearm { animation: forearmThrust 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes hipRise {
        0% { transform: translate(195px,304px); }
        42% { transform: translate(220px,245px); }
        55% { transform: translate(220px,245px); }
        100% { transform: translate(195px,304px); }
      }
      @keyframes torsoThrust {
        0% { transform: rotate(-50deg); }
        42% { transform: rotate(-90deg); }
        55% { transform: rotate(-90deg); }
        100% { transform: rotate(-50deg); }
      }
      @keyframes thighThrust {
        0% { transform: rotate(122deg); }
        42% { transform: rotate(84deg); }
        55% { transform: rotate(84deg); }
        100% { transform: rotate(122deg); }
      }
      @keyframes shinThrust {
        0% { transform: rotate(-104deg); }
        42% { transform: rotate(-92deg); }
        55% { transform: rotate(-92deg); }
        100% { transform: rotate(-104deg); }
      }
      @keyframes footThrust {
        0% { transform: rotate(-18deg); }
        42% { transform: rotate(8deg); }
        55% { transform: rotate(8deg); }
        100% { transform: rotate(-18deg); }
      }
      @keyframes upperArmThrust {
        0% { transform: rotate(61deg); }
        42% { transform: rotate(146deg); }
        55% { transform: rotate(146deg); }
        100% { transform: rotate(61deg); }
      }
      @keyframes forearmThrust {
        0% { transform: rotate(92deg); }
        42% { transform: rotate(83deg); }
        55% { transform: rotate(83deg); }
        100% { transform: rotate(92deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="34" y="215" width="112" height="20" rx="9"/>
    <rect x="49" y="235" width="15" height="117" rx="5"/>
    <rect x="116" y="235" width="15" height="117" rx="5"/>
    <rect x="34" y="343" width="45" height="9" rx="4"/>
    <rect x="101" y="343" width="45" height="9" rx="4"/>
  </g>
  <path class="motion-trail" d="M 177 299 Q 185 269 207 240" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 207 230 L 210 247 L 195 240 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g class="segment hip-rise">
    <g class="segment thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-secondary" cx="-6" cy="36" rx="9" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="7" cy="54" rx="7" ry="21" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <g transform="translate(0,88)">
        <g class="segment shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,84)">
            <g class="segment foot">
              <path d="M -10 -11 L 30 -11 Q 40 -11 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -22 13 C -28 -15 -27 -69 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 22 13 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-15" cy="-3" rx="16" ry="23" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="14" cy="-55" rx="8" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,62)">
                <ellipse cx="0" cy="0" rx="10" ry="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(0,-10)" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
      <rect x="-31" y="-5" width="62" height="10" rx="5"/>
      <rect x="-34" y="-13" width="13" height="26" rx="4"/>
      <rect x="21" y="-13" width="13" height="26" rx="4"/>
      <rect x="-11" y="-8" width="22" height="16" rx="6"/>
    </g>
  </g>
</svg>
