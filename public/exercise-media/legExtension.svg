<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Leg Extension</title>
  <desc>A person sits upright against the back pad of a leg extension machine with the machine pivot aligned to the knee and a roller across the ankles. They keep the thigh flat, straighten the knee until the leg is almost horizontal, pause briefly, then lower the roller slowly.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .torso { transform: rotate(0deg); }
    .thigh { transform: rotate(-88deg); }
    .shin { transform: rotate(88deg); }
    .foot { transform: rotate(0deg); }
    .machine-arm { transform: rotate(0deg); }

    .muscle-highlight-primary {
      opacity: 0.85;
      filter: blur(4px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .shin { animation: shinExtension 3s ease-in-out infinite; }
      .foot { animation: footExtension 3s ease-in-out infinite; }
      .machine-arm { animation: machineExtension 3s ease-in-out infinite; }
      .muscle-highlight-primary { animation: quadricepsGlow 3s ease-in-out infinite; }

      @keyframes shinExtension {
        0% { transform: rotate(88deg); }
        42% { transform: rotate(8deg); }
        55% { transform: rotate(8deg); }
        100% { transform: rotate(88deg); }
      }

      @keyframes footExtension {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(80deg); }
        55% { transform: rotate(80deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes machineExtension {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-80deg); }
        55% { transform: rotate(-80deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes quadricepsGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round" />
    <rect x="58" y="130" width="30" height="222" rx="7" />
    <rect x="63" y="145" width="20" height="25" rx="3" />
    <rect x="63" y="176" width="20" height="25" rx="3" />
    <rect x="63" y="207" width="20" height="25" rx="3" />
    <rect x="63" y="238" width="20" height="25" rx="3" />
    <path d="M 105 112 L 132 116 L 153 252 L 119 257 Z" />
    <rect x="112" y="246" width="145" height="19" rx="9" />
    <rect x="111" y="264" width="25" height="88" rx="6" />
    <path d="M 130 342 L 278 342 L 292 352 L 116 352 Z" />
    <rect x="220" y="236" width="46" height="16" rx="8" />
    <circle cx="239" cy="251" r="12" />
    <circle cx="239" cy="251" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none" />
  </g>

  <g transform="translate(239,251)">
    <g class="segment machine-arm">
      <path d="M 0 0 L 0 72" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" />
      <rect x="-24" y="63" width="48" height="20" rx="10" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round" />
    </g>
  </g>

  <g transform="translate(151,254)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14" />
      <ellipse class="muscle-highlight-primary" cx="1" cy="43" rx="10" ry="31" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />

      <g transform="translate(0,88)">
        <g class="segment shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11" />

          <g transform="translate(0,84)">
            <g class="segment foot">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(151,254)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <path d="M -18 12 C -23 -20 -25 -70 -20 -92 Q -17 -99 -8 -99 L 15 -99 Q 24 -99 26 -90 C 29 -63 25 -17 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <g transform="translate(0,-96)">
        <g class="segment" transform="rotate(-8)">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

          <g transform="translate(0,67)">
            <g class="segment" transform="rotate(-34)">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
