name: CI

# Runs on every pull request and on every push to a feature branch.
# Deployment lives in a separate workflow (added in milestone M9) so that a
# failing check can never ship anything.

on:
  pull_request:
  push:
    branches-ignore:
      - main

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Checks the committed animations against the match table that describes
      # them — see docs/EXERCISE_MEDIA_SPEC.md section 7. The test suite runs the
      # same check, so this is belt and braces — but it is the step whose failure
      # message names the file.
      - name: Verify exercise animations
        run: npm run media:verify

      # Catches artwork that was changed without `npm run icons:generate` being
      # run, which would otherwise ship an icon the repository does not describe.
      # The test suite runs the same check — this is the step that names the file.
      - name: Verify app icons
        run: npm run icons:verify

      - name: Build
        run: npm run build
