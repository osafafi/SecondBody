<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Seated Hip Abduction</title>
  <desc>A person sits tall in a hip abduction machine with pads against the outside of the knees. The knees move smoothly apart while the torso stays upright, pause in the wide position, then return slowly together as the glutes glow.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .left-thigh,
    .left-pad { transform: rotate(-12deg); }
    .right-thigh,
    .right-pad { transform: rotate(12deg); }
    .left-shin { transform: rotate(12deg); }
    .right-shin { transform: rotate(-12deg); }
    .muscle-highlight-primary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .left-thigh,
      .left-pad { animation: leftOpen 3s ease-in-out infinite; }
      .right-thigh,
      .right-pad { animation: rightOpen 3s ease-in-out infinite; }
      .left-shin { animation: leftShin 3s ease-in-out infinite; }
      .right-shin { animation: rightShin 3s ease-in-out infinite; }
      .muscle-highlight-primary { animation: gluteGlow 3s ease-in-out infinite; }
      @keyframes leftOpen {
        0% { transform: rotate(-12deg); }
        42% { transform: rotate(22deg); }
        55% { transform: rotate(22deg); }
        100% { transform: rotate(-12deg); }
      }
      @keyframes rightOpen {
        0% { transform: rotate(12deg); }
        42% { transform: rotate(-22deg); }
        55% { transform: rotate(-22deg); }
        100% { transform: rotate(12deg); }
      }
      @keyframes leftShin {
        0% { transform: rotate(12deg); }
        42% { transform: rotate(-22deg); }
        55% { transform: rotate(-22deg); }
        100% { transform: rotate(12deg); }
      }
      @keyframes rightShin {
        0% { transform: rotate(-12deg); }
        42% { transform: rotate(22deg); }
        55% { transform: rotate(22deg); }
        100% { transform: rotate(-12deg); }
      }
      @keyframes gluteGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="25" y1="352" x2="375" y2="352" stroke-linecap="round"/>
    <rect x="145" y="91" width="110" height="130" rx="18"/>
    <rect x="126" y="202" width="148" height="22" rx="10"/>
    <rect x="187" y="218" width="26" height="134" rx="7"/>
    <rect x="151" y="343" width="98" height="9" rx="4"/>
    <rect x="318" y="131" width="38" height="205" rx="7"/>
    <rect x="324" y="151" width="26" height="26" rx="4"/>
    <rect x="324" y="183" width="26" height="26" rx="4"/>
    <rect x="324" y="215" width="26" height="26" rx="4"/>
    <rect x="324" y="247" width="26" height="26" rx="4"/>
    <path d="M 274 212 L 318 212 L 318 318 L 244 318" fill="none" stroke-linecap="round"/>
    <circle cx="176" cy="208" r="7"/>
    <circle cx="224" cy="208" r="7"/>
  </g>

  <g transform="translate(176,208)">
    <g class="segment left-pad" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
      <path d="M 0 5 L 0 78" fill="none" stroke-linecap="round"/>
      <rect x="-32" y="70" width="22" height="34" rx="8"/>
    </g>
  </g>
  <g transform="translate(224,208)">
    <g class="segment right-pad" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
      <path d="M 0 5 L 0 78" fill="none" stroke-linecap="round"/>
      <rect x="10" y="70" width="22" height="34" rx="8"/>
    </g>
  </g>

  <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(174,113)">
      <g class="segment" transform="rotate(5)">
        <rect x="-11" y="-11" width="22" height="89" rx="11"/>
        <g transform="translate(0,67)">
          <g class="segment" transform="rotate(-8)">
            <rect x="-9" y="-9" width="18" height="80" rx="9"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(226,113)">
      <g class="segment" transform="rotate(-5)">
        <rect x="-11" y="-11" width="22" height="89" rx="11"/>
        <g transform="translate(0,67)">
          <g class="segment" transform="rotate(8)">
            <rect x="-9" y="-9" width="18" height="80" rx="9"/>
          </g>
        </g>
      </g>
    </g>

    <path d="M 179 117 L 176 94 Q 176 86 184 85 L 216 85 Q 224 86 224 94 L 221 117 Z"/>
    <path d="M 182 216 C 171 191 169 145 171 119 Q 172 108 184 106 L 216 106 Q 228 108 229 119 C 231 145 229 191 218 216 Z"/>
    <path d="M 178 194 Q 200 184 222 194 L 226 217 Q 200 230 174 217 Z"/>
    <ellipse class="muscle-highlight-primary" cx="180" cy="204" rx="15" ry="20" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="220" cy="204" rx="15" ry="20" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <path d="M 197 48 C 210 48 220 57 220 69 C 220 74 224 77 227 79 Q 229 82 225 84 L 220 84 C 218 94 210 101 197 101 C 184 101 176 91 176 75 C 176 59 184 48 197 48 Z"/>
  </g>

  <g transform="translate(176,208)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment left-thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <g transform="translate(0,88)">
        <g class="segment left-shin">
          <rect x="-11" y="-11" width="22" height="71" rx="11"/>
          <g transform="translate(0,55)">
            <path d="M -10 -10 L 30 -10 Q 40 -10 40 -2 L 40 6 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(224,208)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment right-thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <g transform="translate(0,88)">
        <g class="segment right-shin">
          <rect x="-11" y="-11" width="22" height="71" rx="11"/>
          <g transform="translate(0,55)">
            <path d="M 10 -10 L -30 -10 Q -40 -10 -40 -2 L -40 6 Q -40 11 -31 11 L 10 11 Q 15 11 15 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
