<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Doorway Pec Stretch</title>
  <desc>A person stands beside a door frame facing right with one forearm flat against the frame and the elbow bent at shoulder height. They step the same-side foot forward and turn the chest away from the frame, gently opening the front of the chest and shoulder.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .body-shift { transform: translate(0px, 0px); }
    .torso { transform: rotate(0deg); }
    .upper-arm { transform: rotate(-90deg); }
    .forearm { transform: rotate(-90deg); }
    .thigh { transform: rotate(35deg); }
    .shin { transform: rotate(-87deg); }
    .foot { transform: rotate(52deg); }
    .muscle-highlight-primary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .body-shift { animation: stepThrough 3s ease-in-out infinite; }
      .torso { animation: torsoTurn 3s ease-in-out infinite; }
      .upper-arm { animation: armBrace 3s ease-in-out infinite; }
      .thigh { animation: thighStep 3s ease-in-out infinite; }
      .shin { animation: shinStep 3s ease-in-out infinite; }
      .foot { animation: footLevel 3s ease-in-out infinite; }
      .muscle-highlight-primary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes stepThrough {
        0% { transform: translate(0px, 0px); }
        42% { transform: translate(14px, 0px); }
        55% { transform: translate(14px, 0px); }
        100% { transform: translate(0px, 0px); }
      }
      @keyframes torsoTurn {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(-8deg); }
        55% { transform: rotate(-8deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes armBrace {
        0% { transform: rotate(-90deg); }
        42% { transform: rotate(-82deg); }
        55% { transform: rotate(-82deg); }
        100% { transform: rotate(-90deg); }
      }
      @keyframes thighStep {
        0% { transform: rotate(35deg); }
        42% { transform: rotate(-26deg); }
        55% { transform: rotate(-26deg); }
        100% { transform: rotate(35deg); }
      }
      @keyframes shinStep {
        0% { transform: rotate(-87deg); }
        42% { transform: rotate(22deg); }
        55% { transform: rotate(22deg); }
        100% { transform: rotate(-87deg); }
      }
      @keyframes footLevel {
        0% { transform: rotate(52deg); }
        42% { transform: rotate(4deg); }
        55% { transform: rotate(4deg); }
        100% { transform: rotate(52deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="266" y="42" width="18" height="310" rx="4"/>
    <rect x="266" y="42" width="88" height="16" rx="4"/>
  </g>
  <g transform="translate(190,220)">
    <g class="segment body-shift">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -10 -9 L 29 -9 Q 40 -9 40 0 L 40 5 Q 40 10 31 10 L -10 10 Q -15 10 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g class="segment torso">
        <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <ellipse class="muscle-highlight-primary" cx="14" cy="-64" rx="10" ry="27" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            <ellipse class="muscle-highlight-primary" cx="0" cy="13" rx="9" ry="15" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                <g transform="translate(0,62)">
                  <rect x="-8" y="-8" width="16" height="25" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
