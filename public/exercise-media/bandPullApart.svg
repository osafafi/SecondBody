<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="bandPullApartTitle">
  <title id="bandPullApartTitle">Band Pull-Apart</title>
  <desc>A standing person holds a resistance band at shoulder height with straight arms projecting forward, then opens both arms wide while stretching the band across the chest and squeezing the shoulder blades together.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .left-arm { transform: rotate(72deg) scaleY(0.14); }
    .right-arm { transform: rotate(-72deg) scaleY(0.14); }
    .band { transform: translateY(6px) scaleX(0.25); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .left-arm { animation: leftArmPull 3s ease-in-out infinite; }
      .right-arm { animation: rightArmPull 3s ease-in-out infinite; }
      .band { animation: bandStretch 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes leftArmPull {
        0% { transform: rotate(72deg) scaleY(0.14); }
        42% { transform: rotate(90deg) scaleY(1); }
        55% { transform: rotate(90deg) scaleY(1); }
        100% { transform: rotate(72deg) scaleY(0.14); }
      }

      @keyframes rightArmPull {
        0% { transform: rotate(-72deg) scaleY(0.14); }
        42% { transform: rotate(-90deg) scaleY(1); }
        55% { transform: rotate(-90deg) scaleY(1); }
        100% { transform: rotate(-72deg) scaleY(0.14); }
      }

      @keyframes bandStretch {
        0% { transform: translateY(6px) scaleX(0.25); }
        42% { transform: translateY(0) scaleX(1); }
        55% { transform: translateY(0) scaleX(1); }
        100% { transform: translateY(6px) scaleX(0.25); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>

  <g transform="translate(200,202) scale(0.82)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(-7,0)">
      <g transform="rotate(5)">
        <rect x="-14" y="-14" width="28" height="116" rx="14"/>
        <g transform="translate(0,88)">
          <g transform="rotate(-5)">
            <rect x="-11" y="-11" width="22" height="106" rx="11"/>
            <g transform="translate(0,84)">
              <path d="M -11 -12 L 29 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 30 11 L -11 11 Q -16 11 -16 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(7,0)">
      <g transform="rotate(-5)">
        <rect x="-14" y="-14" width="28" height="116" rx="14"/>
        <g transform="translate(0,88)">
          <g transform="rotate(5)">
            <rect x="-11" y="-11" width="22" height="106" rx="11"/>
            <g transform="translate(0,84)">
              <g transform="rotate(180)">
                <path d="M -11 -12 L 29 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 30 11 L -11 11 Q -16 11 -16 0 Z"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(-20,-96)">
      <g class="segment left-arm">
        <rect x="-11" y="-11" width="22" height="89" rx="11" vector-effect="non-scaling-stroke"/>
        <g transform="translate(0,67)">
          <rect x="-9" y="-9" width="18" height="80" rx="9" vector-effect="non-scaling-stroke"/>
          <g transform="translate(0,62)">
            <circle cx="0" cy="0" r="10" vector-effect="non-scaling-stroke"/>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(20,-96)">
      <g class="segment right-arm">
        <rect x="-11" y="-11" width="22" height="89" rx="11" vector-effect="non-scaling-stroke"/>
        <g transform="translate(0,67)">
          <rect x="-9" y="-9" width="18" height="80" rx="9" vector-effect="non-scaling-stroke"/>
          <g transform="translate(0,62)">
            <circle cx="0" cy="0" r="10" vector-effect="non-scaling-stroke"/>
          </g>
        </g>
      </g>
    </g>

    <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 10 -99 Q 19 -99 22 -92 C 28 -70 26 -20 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
    <ellipse class="muscle-highlight-primary" cx="0" cy="-55" rx="19" ry="27" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="-21" cy="-88" rx="10" ry="13" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-primary" cx="21" cy="-88" rx="10" ry="13" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    <ellipse class="muscle-highlight-secondary" cx="0" cy="-88" rx="18" ry="10" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

    <rect x="-9" y="-124" width="18" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
    <path d="M 0 -162 C 12 -162 21 -153 21 -142 C 21 -137 25 -134 27 -131 C 28 -129 25 -127 21 -127 C 19 -121 11 -118 0 -118 C -12 -118 -20 -127 -20 -140 C -20 -153 -12 -162 0 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>

    <g transform="translate(0,-96)">
      <g class="segment band">
        <line x1="-149" y1="0" x2="149" y2="0" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </g>
    </g>
  </g>
</svg>
