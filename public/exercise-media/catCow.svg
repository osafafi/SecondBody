<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Cat-Cow</title>
  <desc>A person on all fours on an exercise mat, viewed in profile. They slowly round the entire back upward while tucking the head, pause, then reverse the curve by opening the chest and lifting the tailbone before returning to a flat back.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .lumbar { transform: rotate(81deg); }
    .mid-spine { transform: rotate(0deg); }
    .upper-spine { transform: rotate(0deg); }
    .arm { transform: rotate(-53deg); }
    .head { transform: rotate(-81deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .lumbar { animation: lumbarCatCow 3s ease-in-out infinite; }
      .mid-spine { animation: midSpineCatCow 3s ease-in-out infinite; }
      .upper-spine { animation: upperSpineCatCow 3s ease-in-out infinite; }
      .arm { animation: armCatCow 3s ease-in-out infinite; }
      .head { animation: headCatCow 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes lumbarCatCow {
        0% { transform: rotate(81deg); }
        34% { transform: rotate(58deg); }
        46% { transform: rotate(58deg); }
        80% { transform: rotate(98deg); }
        88% { transform: rotate(98deg); }
        100% { transform: rotate(81deg); }
      }
      @keyframes midSpineCatCow {
        0% { transform: rotate(0deg); }
        34% { transform: rotate(23deg); }
        46% { transform: rotate(23deg); }
        80% { transform: rotate(-17deg); }
        88% { transform: rotate(-17deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes upperSpineCatCow {
        0% { transform: rotate(0deg); }
        34% { transform: rotate(23deg); }
        46% { transform: rotate(23deg); }
        80% { transform: rotate(-17deg); }
        88% { transform: rotate(-17deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes armCatCow {
        0% { transform: rotate(-53deg); }
        34% { transform: rotate(-76deg); }
        46% { transform: rotate(-76deg); }
        80% { transform: rotate(-36deg); }
        88% { transform: rotate(-36deg); }
        100% { transform: rotate(-53deg); }
      }
      @keyframes headCatCow {
        0% { transform: rotate(-81deg); }
        34% { transform: rotate(-62deg); }
        46% { transform: rotate(-62deg); }
        80% { transform: rotate(-94deg); }
        88% { transform: rotate(-94deg); }
        100% { transform: rotate(-81deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        34% { opacity: 0.85; }
        46% { opacity: 0.85; }
        80% { opacity: 0.65; }
        88% { opacity: 0.65; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="34" y="340" width="332" height="12" rx="6"/>
  </g>
  <g transform="translate(140,250)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(0)">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(88)">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <g transform="translate(0,84)">
            <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(140,250)">
    <g class="segment lumbar">
      <path d="M -18 10 C -22 -8 -22 -38 -18 -56 Q -16 -62 -9 -62 L 10 -62 Q 18 -62 20 -55 C 23 -34 22 -8 18 10 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="-8" cy="-28" rx="10" ry="24" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="12" cy="-27" rx="9" ry="22" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <g transform="translate(0,-52)">
        <g class="segment mid-spine">
          <path d="M -21 10 C -24 -11 -24 -40 -20 -57 Q -18 -63 -10 -63 L 11 -63 Q 20 -63 22 -56 C 25 -36 24 -8 21 10 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-primary" cx="-9" cy="-29" rx="11" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="13" cy="-28" rx="9" ry="21" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,-52)">
            <g class="segment upper-spine">
              <path d="M -22 10 C -25 -10 -25 -40 -21 -57 Q -19 -64 -10 -64 L 12 -64 Q 21 -64 23 -56 C 26 -34 25 -7 22 10 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <ellipse class="muscle-highlight-primary" cx="-10" cy="-30" rx="12" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
              <g transform="translate(0,-52)">
                <g class="segment head">
                  <rect x="-8" y="-23" width="18" height="28" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                  <path d="M 2 -62 C 14 -62 23 -53 23 -42 C 23 -37 28 -34 30 -31 C 31 -28 28 -27 24 -27 C 22 -20 14 -17 3 -17 C -10 -17 -18 -27 -18 -40 C -18 -53 -10 -62 2 -62 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                </g>
                <g class="segment arm">
                  <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                  <g transform="translate(0,67)">
                    <g transform="rotate(-59)">
                      <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                      <g transform="translate(0,62)">
                        <path d="M -10 -8 C -7 -13 7 -13 11 -7 L 14 4 Q 14 10 7 11 L -9 11 Q -14 9 -13 3 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                      </g>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
