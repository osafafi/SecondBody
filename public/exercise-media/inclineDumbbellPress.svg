<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Incline Dumbbell Press</title>
  <desc>A person lies back on a bench inclined to about thirty degrees, holding two dumbbells outside the chest with bent elbows. They press the dumbbells upward and slightly together until the arms are nearly straight, pause without touching the weights together, then lower slowly to chest level.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .torso { transform: rotate(-60deg); }
    .upper-arm { transform: rotate(30deg); }
    .forearm { transform: rotate(-155deg); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    .motion-trail { opacity: 0.5; }

    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmPress 3s ease-in-out infinite; }
      .forearm { animation: forearmPress 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes upperArmPress {
        0% { transform: rotate(30deg); }
        42% { transform: rotate(-90deg); }
        55% { transform: rotate(-90deg); }
        100% { transform: rotate(30deg); }
      }

      @keyframes forearmPress {
        0% { transform: rotate(-155deg); }
        42% { transform: rotate(0deg); }
        55% { transform: rotate(0deg); }
        100% { transform: rotate(-155deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <line x1="24" y1="352" x2="376" y2="352" />
    <path d="M 94 196 L 104 180 L 266 274 L 256 291 Z" />
    <rect x="242" y="278" width="94" height="17" rx="8" />
    <rect x="258" y="291" width="18" height="61" rx="6" />
    <rect x="319" y="291" width="15" height="61" rx="5" />
    <path d="M 187 245 L 199 239 L 272 343 L 260 350 Z" />
    <rect x="241" y="343" width="52" height="9" rx="4" />
    <rect x="306" y="343" width="44" height="9" rx="4" />
  </g>

  <g transform="translate(245,272)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-55)">
      <rect x="-14" y="-14" width="28" height="116" rx="14" />
      <g transform="translate(0,88)">
        <g transform="rotate(122)">
          <rect x="-11" y="-11" width="22" height="106" rx="11" />
          <g transform="translate(0,84)">
            <g transform="rotate(-67)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <path class="motion-trail" d="M 193 209 Q 204 163 224 124" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" />
  <path class="motion-trail" d="M 230 113 L 218 126 L 232 130 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none" />

  <g transform="translate(245,272)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
      <ellipse class="muscle-highlight-primary" cx="10" cy="-57" rx="13" ry="28" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
      <ellipse class="muscle-highlight-primary" cx="3" cy="-94" rx="13" ry="12" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />

      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
          <ellipse class="muscle-highlight-secondary" cx="-3" cy="31" rx="8" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />

          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

              <g transform="translate(0,62)" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
                <g transform="translate(7,4)">
                  <rect x="-20" y="-4" width="40" height="8" rx="4" />
                  <rect x="-27" y="-12" width="9" height="24" rx="3" />
                  <rect x="18" y="-12" width="9" height="24" rx="3" />
                </g>
                <rect x="-20" y="-4" width="40" height="8" rx="4" />
                <rect x="-28" y="-13" width="10" height="26" rx="3" />
                <rect x="18" y="-13" width="10" height="26" rx="3" />
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
