<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Chin Tucks</title>
  <desc>A person shown in profile sits or stands tall with the head slightly forward. The head glides gently straight back until the ear is over the shoulder while the eyes remain level, holds briefly, then releases without tipping the chin down.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .head-glide {
      transform: translate(18px, 0px) rotate(0deg);
    }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail {
      opacity: 0.5;
    }
    @media (prefers-reduced-motion: no-preference) {
      .head-glide {
        animation: chinTuckGlide 3s ease-in-out infinite;
      }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail {
        animation: muscleGlow 3s ease-in-out infinite;
      }
      @keyframes chinTuckGlide {
        0% { transform: translate(18px, 0px) rotate(0deg); }
        42% { transform: translate(0px, 0px) rotate(0deg); }
        55% { transform: translate(0px, 0px) rotate(0deg); }
        100% { transform: translate(18px, 0px) rotate(0deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <path class="motion-trail" d="M 274 91 L 231 91" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 220 91 L 235 83 L 235 99 Z" fill="var(--muscle-motion-trail, #7C5CFF)"/>

  <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <path d="M 158 352 C 159 318 160 276 164 232 C 166 209 174 193 190 185 Q 205 176 224 183 C 239 190 244 209 246 233 C 250 276 249 318 250 352 Z"/>
    <path d="M 197 191 C 197 177 198 162 200 149 Q 202 141 210 140 L 218 140 Q 225 142 226 150 C 226 164 224 178 224 190 Z"/>
    <ellipse class="muscle-highlight-secondary" cx="198" cy="199" rx="28" ry="12" transform="rotate(-16 198 199)" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
    <path d="M 181 215 Q 201 191 225 190" fill="none" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(214,132)">
    <g class="segment head-glide">
      <path d="M -9 -24 C 3 -28 16 -22 21 -13 C 23 -9 23 -5 24 -2 L 30 2 Q 33 5 29 8 L 24 10 C 25 15 23 20 18 23 C 12 27 2 27 -6 24 C -15 20 -20 11 -20 1 C -20 -10 -17 -19 -9 -24 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-3" cy="2" r="5" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
      <circle cx="13" cy="-8" r="2.5" fill="var(--muscle-body-stroke, #4A4470)" stroke="none"/>
      <path d="M 18 15 Q 13 17 9 15" fill="none" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linecap="round"/>
      <ellipse class="muscle-highlight-primary" cx="-6" cy="25" rx="8" ry="22" transform="rotate(-8 -6 25)" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
    </g>
  </g>
</svg>
