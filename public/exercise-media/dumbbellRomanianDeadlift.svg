<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Dumbbell Romanian Deadlift</title>
  <desc>A person stands in profile holding dumbbells against the front of the thighs. With the knees softly bent and held still, they push the hips back, hinge forward with a flat back, and slide the dumbbells close to the legs until just below the knees, then drive the hips forward to stand tall. The hamstrings, glutes, back, and forearms glow during the hinge.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .hip-shift { transform: translate(0, 0); }
    .torso { transform: rotate(0deg); }
    .thigh { transform: rotate(5deg); }
    .shin { transform: rotate(-10deg); }
    .foot { transform: rotate(5deg); }
    .upper-arm { transform: rotate(-5deg); }
    .forearm { transform: rotate(0deg); }
    .dumbbell { transform: rotate(5deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .hip-shift { animation: hipHinge 3s ease-in-out infinite; }
      .torso { animation: torsoHinge 3s ease-in-out infinite; }
      .thigh { animation: thighHinge 3s ease-in-out infinite; }
      .shin { animation: shinHinge 3s ease-in-out infinite; }
      .foot { animation: footHinge 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmHinge 3s ease-in-out infinite; }
      .forearm { animation: forearmHinge 3s ease-in-out infinite; }
      .dumbbell { animation: dumbbellHinge 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes hipHinge {
        0% { transform: translate(0, 0); }
        42% { transform: translate(-25px, 1px); }
        55% { transform: translate(-25px, 1px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes torsoHinge {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(55deg); }
        55% { transform: rotate(55deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes thighHinge {
        0% { transform: rotate(5deg); }
        42% { transform: rotate(-10deg); }
        55% { transform: rotate(-10deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes shinHinge {
        0% { transform: rotate(-10deg); }
        42% { transform: rotate(3deg); }
        55% { transform: rotate(3deg); }
        100% { transform: rotate(-10deg); }
      }
      @keyframes footHinge {
        0% { transform: rotate(5deg); }
        42% { transform: rotate(7deg); }
        55% { transform: rotate(7deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes upperArmHinge {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-33deg); }
        55% { transform: rotate(-33deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes forearmHinge {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(0deg); }
        55% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes dumbbellHinge {
        0% { transform: rotate(5deg); }
        42% { transform: rotate(-22deg); }
        55% { transform: rotate(-22deg); }
        100% { transform: rotate(5deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>
  <g transform="translate(34,38) scale(.85)">
    <g transform="translate(196,188)">
      <g class="segment hip-shift">
        <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
          <ellipse cx="-5" cy="2" rx="24" ry="22"/>
          <ellipse class="muscle-highlight-primary" cx="-13" cy="0" rx="15" ry="16" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        </g>
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-primary" cx="-6" cy="43" rx="10" ry="34" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                </g>
              </g>
            </g>
          </g>
        </g>
        <g class="segment torso">
          <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="-12" cy="-48" rx="9" ry="34" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-4" cy="-77" rx="13" ry="17" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,-96)">
            <g class="segment upper-arm">
              <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,67)">
                <g class="segment forearm">
                  <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
                  <ellipse class="muscle-highlight-secondary" cx="0" cy="34" rx="7" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
                  <g transform="translate(0,70)">
                    <g class="segment dumbbell" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
                      <g transform="translate(-7,-6)" opacity="0.5">
                        <rect x="-13" y="-4" width="26" height="8" rx="3"/>
                        <rect x="-24" y="-13" width="11" height="26" rx="3"/>
                        <rect x="13" y="-13" width="11" height="26" rx="3"/>
                      </g>
                      <rect x="-13" y="-4" width="26" height="8" rx="3"/>
                      <rect x="-25" y="-16" width="12" height="32" rx="3"/>
                      <rect x="13" y="-16" width="12" height="32" rx="3"/>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
