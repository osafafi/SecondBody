<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Rowing Machine, Easy</title>
  <desc>A person rows at an easy pace, starting at the catch with bent knees, a flat back leaning slightly forward, and straight arms. They push with the legs first, lean slightly back, then draw the handle to the bottom ribs before extending the arms and returning slowly.</desc>
  <style>
    .segment,.rider-drive,.seat-drive{transform-box:view-box;transform-origin:0 0}
    .rider-drive{transform:translateX(0)}
    .seat-drive{transform:translateX(0)}
    .torso{transform:rotate(12deg)}
    .thigh{transform:rotate(-96deg)}
    .shin{transform:rotate(96deg)}
    .foot{transform:rotate(-65deg)}
    .upper-arm{transform:rotate(-43deg)}
    .forearm{transform:rotate(0deg)}
    .chain{transform:rotate(-131deg) scaleY(.2)}
    .muscle-highlight-primary,.muscle-highlight-secondary{opacity:.85;filter:blur(4px)}
    .motion-trail{opacity:.5}
    @media (prefers-reduced-motion: no-preference){
      .rider-drive{animation:riderDrive 3s ease-in-out infinite}
      .seat-drive{animation:seatDrive 3s ease-in-out infinite}
      .torso{animation:torsoDrive 3s ease-in-out infinite}
      .thigh{animation:thighDrive 3s ease-in-out infinite}
      .shin{animation:shinDrive 3s ease-in-out infinite}
      .foot{animation:footDrive 3s ease-in-out infinite}
      .upper-arm{animation:upperArmDrive 3s ease-in-out infinite}
      .forearm{animation:forearmDrive 3s ease-in-out infinite}
      .chain{animation:chainDrive 3s ease-in-out infinite}
      .muscle-highlight-primary,.muscle-highlight-secondary,.motion-trail{animation:muscleGlow 3s ease-in-out infinite}
      @keyframes riderDrive{
        0%{transform:translateX(0)}
        24%{transform:translateX(-58px)}
        42%{transform:translateX(-75px)}
        55%{transform:translateX(-75px)}
        72%{transform:translateX(-75px)}
        88%{transform:translateX(-20px)}
        100%{transform:translateX(0)}
      }
      @keyframes seatDrive{
        0%{transform:translateX(0)}
        24%{transform:translateX(-58px)}
        42%{transform:translateX(-75px)}
        55%{transform:translateX(-75px)}
        72%{transform:translateX(-75px)}
        88%{transform:translateX(-20px)}
        100%{transform:translateX(0)}
      }
      @keyframes torsoDrive{
        0%{transform:rotate(12deg)}
        24%{transform:rotate(4deg)}
        42%{transform:rotate(-10deg)}
        55%{transform:rotate(-10deg)}
        72%{transform:rotate(-10deg)}
        88%{transform:rotate(8deg)}
        100%{transform:rotate(12deg)}
      }
      @keyframes thighDrive{
        0%{transform:rotate(-96deg)}
        24%{transform:rotate(-70deg)}
        42%{transform:rotate(-64deg)}
        55%{transform:rotate(-64deg)}
        72%{transform:rotate(-64deg)}
        88%{transform:rotate(-88deg)}
        100%{transform:rotate(-96deg)}
      }
      @keyframes shinDrive{
        0%{transform:rotate(96deg)}
        24%{transform:rotate(20deg)}
        42%{transform:rotate(0deg)}
        55%{transform:rotate(0deg)}
        72%{transform:rotate(0deg)}
        88%{transform:rotate(72deg)}
        100%{transform:rotate(96deg)}
      }
      @keyframes footDrive{
        0%{transform:rotate(-65deg)}
        24%{transform:rotate(-20deg)}
        42%{transform:rotate(0deg)}
        55%{transform:rotate(0deg)}
        72%{transform:rotate(0deg)}
        88%{transform:rotate(-48deg)}
        100%{transform:rotate(-65deg)}
      }
      @keyframes upperArmDrive{
        0%{transform:rotate(-43deg)}
        24%{transform:rotate(-43deg)}
        42%{transform:rotate(35deg)}
        55%{transform:rotate(35deg)}
        72%{transform:rotate(-43deg)}
        88%{transform:rotate(-43deg)}
        100%{transform:rotate(-43deg)}
      }
      @keyframes forearmDrive{
        0%{transform:rotate(0deg)}
        24%{transform:rotate(0deg)}
        42%{transform:rotate(-127deg)}
        55%{transform:rotate(-127deg)}
        72%{transform:rotate(0deg)}
        88%{transform:rotate(0deg)}
        100%{transform:rotate(0deg)}
      }
      @keyframes chainDrive{
        0%{transform:rotate(-131deg) scaleY(.2)}
        24%{transform:rotate(-92deg) scaleY(.78)}
        42%{transform:rotate(-72deg) scaleY(1.75)}
        55%{transform:rotate(-72deg) scaleY(1.75)}
        72%{transform:rotate(-92deg) scaleY(.92)}
        88%{transform:rotate(-122deg) scaleY(.32)}
        100%{transform:rotate(-131deg) scaleY(.2)}
      }
      @keyframes muscleGlow{
        0%{opacity:.3}
        24%{opacity:.62}
        42%{opacity:.85}
        55%{opacity:.85}
        72%{opacity:.58}
        100%{opacity:.3}
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="28" y1="352" x2="374" y2="352" stroke-linecap="round"/>
    <path d="M72 328 L326 283 L331 293 L77 338 Z"/>
    <path d="M86 334 L72 352 L82 352 L99 331 Z"/>
    <path d="M303 288 L326 352 L338 352 L318 285 Z"/>
    <circle cx="334" cy="274" r="38"/>
    <circle cx="334" cy="274" r="27"/>
    <circle cx="334" cy="274" r="6" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
    <path d="M293 248 L310 241 L324 306 L306 311 Z"/>
    <rect x="294" y="237" width="29" height="8" rx="4" transform="rotate(76 308 241)"/>
    <g transform="translate(225,278)">
      <g class="seat-drive">
        <rect x="-27" y="-7" width="54" height="14" rx="7"/>
        <path d="M-13 7 L-7 21 L7 21 L13 7 Z"/>
      </g>
    </g>
  </g>
  <g transform="translate(326,276)">
    <g class="segment chain">
      <line x1="0" y1="0" x2="0" y2="-100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>
  <path class="motion-trail" d="M286 214 Q236 194 184 207" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M174 211 L188 199 L191 215 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g transform="translate(225,267)">
    <g class="rider-drive">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14"/>
          <ellipse class="muscle-highlight-primary" cx="-5" cy="39" rx="10" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="7" cy="48" rx="7" ry="25" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M-10 -11 L27 -11 Q40 -10 40 0 Q40 10 29 11 L-10 11 Q-15 8 -15 0 Q-15 -7 -10 -11 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
        <g class="segment torso">
          <rect x="-9" y="-124" width="21" height="34" rx="8"/>
          <path d="M-18 12 C-26 -20 -28 -70 -22 -92 Q-19 -99 -10 -99 L13 -99 Q23 -99 25 -91 C29 -66 25 -18 18 12 Z"/>
          <ellipse class="muscle-highlight-primary" cx="-13" cy="-53" rx="11" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="8" cy="-52" rx="10" ry="27" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-primary" cx="-7" cy="-2" rx="14" ry="12" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
          <path d="M3 -162 C14 -162 23 -153 23 -142 C23 -137 26 -134 27 -131 C28 -129 26 -128 23 -128 C22 -122 14 -118 3 -118 C-9 -118 -17 -127 -17 -140 C-17 -152 -9 -162 3 -162 Z"/>
          <g transform="translate(0,-96)">
            <g class="segment upper-arm">
              <rect x="-11" y="-11" width="22" height="89" rx="11"/>
              <ellipse class="muscle-highlight-secondary" cx="0" cy="29" rx="8" ry="19" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
              <g transform="translate(0,67)">
                <g class="segment forearm">
                  <rect x="-9" y="-9" width="18" height="80" rx="9"/>
                  <ellipse class="muscle-highlight-secondary" cx="0" cy="28" rx="6" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
                  <g transform="translate(0,62)">
                    <rect x="-17" y="-6" width="34" height="12" rx="6" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2"/>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
