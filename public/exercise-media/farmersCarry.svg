<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Farmer's Carry</title>
  <desc>A person walks tall in profile while holding a dumbbell at each side. The shoulders stay back and down, the ribs remain stacked over the hips, and the legs exchange positions in a normal stride while the weights hang under steady arms.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .walker { transform: translateX(-10px); }
    .front-thigh { transform: rotate(-25deg); }
    .front-shin { transform: rotate(-25deg); }
    .front-foot { transform: rotate(50deg); }
    .rear-thigh { transform: rotate(25deg); }
    .rear-shin { transform: rotate(25deg); }
    .rear-foot { transform: rotate(-50deg); }
    .front-upper-arm { transform: rotate(7deg); }
    .front-forearm { transform: rotate(-7deg); }
    .rear-upper-arm { transform: rotate(-7deg); }
    .rear-forearm { transform: rotate(7deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .walker { animation: carryTravel 3s ease-in-out infinite; }
      .front-thigh { animation: frontThighCarry 3s ease-in-out infinite; }
      .front-shin { animation: frontShinCarry 3s ease-in-out infinite; }
      .front-foot { animation: frontFootCarry 3s ease-in-out infinite; }
      .rear-thigh { animation: rearThighCarry 3s ease-in-out infinite; }
      .rear-shin { animation: rearShinCarry 3s ease-in-out infinite; }
      .rear-foot { animation: rearFootCarry 3s ease-in-out infinite; }
      .front-upper-arm { animation: frontArmCarry 3s ease-in-out infinite; }
      .front-forearm { animation: frontForearmCarry 3s ease-in-out infinite; }
      .rear-upper-arm { animation: rearArmCarry 3s ease-in-out infinite; }
      .rear-forearm { animation: rearForearmCarry 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes carryTravel {
        0% { transform: translateX(-10px); }
        42% { transform: translateX(10px); }
        55% { transform: translateX(10px); }
        100% { transform: translateX(-10px); }
      }
      @keyframes frontThighCarry {
        0% { transform: rotate(-25deg); }
        42% { transform: rotate(25deg); }
        55% { transform: rotate(25deg); }
        100% { transform: rotate(-25deg); }
      }
      @keyframes frontShinCarry {
        0% { transform: rotate(-25deg); }
        42% { transform: rotate(25deg); }
        55% { transform: rotate(25deg); }
        100% { transform: rotate(-25deg); }
      }
      @keyframes frontFootCarry {
        0% { transform: rotate(50deg); }
        42% { transform: rotate(-50deg); }
        55% { transform: rotate(-50deg); }
        100% { transform: rotate(50deg); }
      }
      @keyframes rearThighCarry {
        0% { transform: rotate(25deg); }
        42% { transform: rotate(-25deg); }
        55% { transform: rotate(-25deg); }
        100% { transform: rotate(25deg); }
      }
      @keyframes rearShinCarry {
        0% { transform: rotate(25deg); }
        42% { transform: rotate(-25deg); }
        55% { transform: rotate(-25deg); }
        100% { transform: rotate(25deg); }
      }
      @keyframes rearFootCarry {
        0% { transform: rotate(-50deg); }
        42% { transform: rotate(50deg); }
        55% { transform: rotate(50deg); }
        100% { transform: rotate(-50deg); }
      }
      @keyframes frontArmCarry {
        0% { transform: rotate(7deg); }
        42% { transform: rotate(-7deg); }
        55% { transform: rotate(-7deg); }
        100% { transform: rotate(7deg); }
      }
      @keyframes frontForearmCarry {
        0% { transform: rotate(-7deg); }
        42% { transform: rotate(7deg); }
        55% { transform: rotate(7deg); }
        100% { transform: rotate(-7deg); }
      }
      @keyframes rearArmCarry {
        0% { transform: rotate(-7deg); }
        42% { transform: rotate(7deg); }
        55% { transform: rotate(7deg); }
        100% { transform: rotate(-7deg); }
      }
      @keyframes rearForearmCarry {
        0% { transform: rotate(7deg); }
        42% { transform: rotate(-7deg); }
        55% { transform: rotate(-7deg); }
        100% { transform: rotate(7deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>
  <g transform="translate(200,220)">
    <g class="walker">
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" opacity="0.78">
        <g class="segment rear-thigh">
          <rect x="-14" y="-12" width="28" height="112" rx="14"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="12" rx="11" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment rear-shin">
              <rect x="-11" y="-10" width="22" height="104" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment rear-foot">
                  <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
        <g transform="translate(-6,-94)">
          <g class="segment rear-upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11"/>
            <g transform="translate(0,67)">
              <g class="segment rear-forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9"/>
                <g transform="translate(0,62)" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2">
                  <rect x="-17" y="-5" width="34" height="10" rx="5"/>
                  <rect x="-23" y="-18" width="9" height="36" rx="3"/>
                  <rect x="14" y="-18" width="9" height="36" rx="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
        <rect x="-9" y="-124" width="21" height="34" rx="8"/>
        <path d="M -18 12 C -24 -20 -27 -69 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 28 -66 25 -18 18 12 Z"/>
        <ellipse class="muscle-highlight-primary" cx="8" cy="-88" rx="15" ry="10" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <ellipse class="muscle-highlight-primary" cx="9" cy="-37" rx="9" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="-12" cy="-59" rx="9" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
        <ellipse class="muscle-highlight-secondary" cx="15" cy="-33" rx="7" ry="22" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z"/>
        <g class="segment front-thigh">
          <rect x="-14" y="-12" width="28" height="112" rx="14"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="12" rx="11" ry="18" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,88)">
            <g class="segment front-shin">
              <rect x="-11" y="-10" width="22" height="104" rx="11"/>
              <g transform="translate(0,84)">
                <g class="segment front-foot">
                  <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
                </g>
              </g>
            </g>
          </g>
        </g>
        <g transform="translate(4,-96)">
          <g class="segment front-upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11"/>
            <g transform="translate(0,67)">
              <g class="segment front-forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9"/>
                <ellipse class="muscle-highlight-primary" cx="0" cy="39" rx="7" ry="23" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
                <g transform="translate(0,62)" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2">
                  <rect x="-17" y="-5" width="34" height="10" rx="5"/>
                  <rect x="-23" y="-18" width="9" height="36" rx="3"/>
                  <rect x="14" y="-18" width="9" height="36" rx="3"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
