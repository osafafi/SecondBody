<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Thread the Needle</title>
  <desc>A person starts on hands and knees with a flat back, then turns through the upper back and slides one arm palm-up beneath the body until that shoulder and the side of the head lower toward the mat.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(78deg); }
    .upper-arm { transform: rotate(-78deg); }
    .forearm { transform: rotate(0deg); }
    .head-thread {
      transform-box: view-box;
      transform-origin: 0 0;
      transform: translate(0,0);
    }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .torso { animation: torsoThread 3s ease-in-out infinite; }
      .upper-arm { animation: upperArmThread 3s ease-in-out infinite; }
      .forearm { animation: forearmThread 3s ease-in-out infinite; }
      .head-thread { animation: headThread 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      .motion-trail { animation: trailPulse 3s ease-in-out infinite; }
      @keyframes torsoThread {
        0% { transform: rotate(78deg); }
        42% { transform: rotate(120deg); }
        55% { transform: rotate(120deg); }
        100% { transform: rotate(78deg); }
      }
      @keyframes upperArmThread {
        0% { transform: rotate(-78deg); }
        42% { transform: rotate(-50deg); }
        55% { transform: rotate(-50deg); }
        100% { transform: rotate(-78deg); }
      }
      @keyframes forearmThread {
        0% { transform: rotate(0deg); }
        42% { transform: rotate(20deg); }
        55% { transform: rotate(20deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes headThread {
        0% { transform: translate(0,0); }
        42% { transform: translate(-43px,106px); }
        55% { transform: translate(-43px,106px); }
        100% { transform: translate(0,0); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
      @keyframes trailPulse {
        0% { opacity: 0.2; }
        42% { opacity: 0.6; }
        55% { opacity: 0.6; }
        100% { opacity: 0.2; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <rect x="35" y="342" width="330" height="10" rx="5"/>
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
  </g>
  <path class="motion-trail" d="M 238 282 Q 190 303 132 285" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 121 280 L 137 276 L 132 291 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g transform="translate(150,244)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment" transform="rotate(0)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g class="segment" transform="rotate(90)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <g class="segment" transform="rotate(-90)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(281,218)">
    <g class="head-thread">
      <path d="M 0 -21 C 12 -21 21 -12 21 -1 C 21 4 24 7 25 10 C 26 12 24 13 21 13 C 20 19 12 23 1 23 C -11 23 -19 14 -19 1 C -19 -11 -11 -21 0 -21 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
  <g transform="translate(150,244)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-secondary" cx="-12" cy="-46" rx="10" ry="23" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <ellipse class="muscle-highlight-primary" cx="-10" cy="-75" rx="12" ry="22" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="0" cy="22" rx="8" ry="17" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,62)">
                <path d="M -8 -6 L 29 -6 Q 38 -6 38 1 Q 38 8 29 8 L -8 8 Q -13 8 -13 1 Q -13 -6 -8 -6 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
