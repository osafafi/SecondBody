<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Couch Stretch</title>
  <desc>A person half-kneels in profile with the rear shin upright against a wall and the front foot flat. They squeeze the rear glute, tuck the pelvis, and bring the torso from a slight forward lean to an upright position, deepening the stretch through the rear hip flexors and quadriceps.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(14deg); }
    .rear-thigh { transform: rotate(32deg); }
    .rear-shin { transform: rotate(130deg); }
    .front-thigh { transform: rotate(-86deg); }
    .front-shin { transform: rotate(86deg); }
    .upper-arm { transform: rotate(-10deg); }
    .forearm { transform: rotate(-55deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .torso {
        animation: torsoStretch 3s ease-in-out infinite;
      }
      .muscle-highlight-primary,
      .muscle-highlight-secondary {
        animation: muscleGlow 3s ease-in-out infinite;
      }
      @keyframes torsoStretch {
        0% { transform: rotate(14deg); }
        42% { transform: rotate(2deg); }
        55% { transform: rotate(2deg); }
        100% { transform: rotate(14deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="25" y1="352" x2="375" y2="352" stroke-linecap="round"/>
    <rect x="72" y="70" width="22" height="282" rx="5"/>
    <rect x="91" y="340" width="87" height="12" rx="6"/>
  </g>

  <g transform="translate(175,260)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment rear-thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <ellipse class="muscle-highlight-primary" cx="1" cy="42" rx="10" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <g transform="translate(0,88)">
        <g class="segment rear-shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <g transform="translate(0,84)">
            <path d="M -10 -12 L 10 -12 L 11 29 Q 11 39 2 42 L -5 42 Q -12 38 -12 29 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(175,260)">
    <g class="segment torso">
      <rect x="-9" y="-125" width="21" height="35" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -24 -18 -27 -68 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 28 -65 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="12" cy="-9" rx="8" ry="22" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="-12" cy="0" rx="10" ry="17" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -170 C 14 -170 23 -161 23 -150 C 23 -145 26 -142 27 -139 C 28 -137 26 -136 23 -136 C 22 -130 14 -126 3 -126 C -9 -126 -17 -135 -17 -148 C -17 -160 -9 -170 3 -170 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(175,260)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment front-thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <g transform="translate(0,88)">
        <g class="segment front-shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <g transform="translate(0,84)">
            <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
