<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Pallof Press</title>
  <desc>A person stands in profile a stride from a chest-height cable pulley, holding the handle against the chest. They press the handle straight forward, keep the torso square against the cable's pull, hold for a beat, and return the hands slowly to the chest. The abdominals and obliques light up as the arms extend.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .torso { transform: rotate(0deg); }
    .upper-arm { transform: rotate(-5deg); }
    .forearm { transform: rotate(152deg); }
    .cable { transform: rotate(89.7deg) scaleY(1.88); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    .motion-trail { opacity: 0.5; }

    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmPress 3s ease-in-out infinite; }
      .forearm { animation: forearmPress 3s ease-in-out infinite; }
      .cable { animation: cablePress 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      .motion-trail { animation: trailPulse 3s ease-in-out infinite; }

      @keyframes upperArmPress {
        0% { transform: rotate(-5deg); }
        42% { transform: rotate(-90deg); }
        55% { transform: rotate(-90deg); }
        100% { transform: rotate(-5deg); }
      }

      @keyframes forearmPress {
        0% { transform: rotate(152deg); }
        42% { transform: rotate(0deg); }
        55% { transform: rotate(0deg); }
        100% { transform: rotate(152deg); }
      }

      @keyframes cablePress {
        0% { transform: rotate(89.7deg) scaleY(1.88); }
        42% { transform: rotate(86.7deg) scaleY(2.78); }
        55% { transform: rotate(86.7deg) scaleY(2.78); }
        100% { transform: rotate(89.7deg) scaleY(1.88); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }

      @keyframes trailPulse {
        0% { opacity: 0.2; }
        42% { opacity: 0.65; }
        55% { opacity: 0.65; }
        100% { opacity: 0.2; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round" />
    <rect x="25" y="82" width="34" height="270" rx="7" />
    <rect x="18" y="343" width="50" height="9" rx="4" />
    <rect x="31" y="103" width="22" height="176" rx="5" />
    <line x1="34" y1="126" x2="50" y2="126" stroke-linecap="round" />
    <line x1="34" y1="151" x2="50" y2="151" stroke-linecap="round" />
    <line x1="34" y1="201" x2="50" y2="201" stroke-linecap="round" />
    <line x1="34" y1="226" x2="50" y2="226" stroke-linecap="round" />
    <circle cx="42" cy="170" r="13" />
    <circle cx="42" cy="170" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none" />
  </g>

  <g transform="translate(42,170)">
    <g class="segment cable">
      <line x1="0" y1="0" x2="0" y2="-100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    </g>
  </g>

  <path class="motion-trail" d="M 239 137 Q 276 126 309 139" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" />
  <path class="motion-trail" d="M 318 145 L 304 132 L 301 148 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none" />

  <g transform="translate(190,250)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(15)">
      <rect x="-14" y="-14" width="28" height="116" rx="14" />
      <g transform="translate(0,88)">
        <g transform="rotate(-93)">
          <rect x="-11" y="-11" width="22" height="106" rx="11" />
          <g transform="translate(0,84)">
            <g transform="rotate(78)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(190,250)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
      <ellipse class="muscle-highlight-primary" cx="-12" cy="-54" rx="10" ry="29" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
      <ellipse class="muscle-highlight-primary" cx="8" cy="-45" rx="10" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />
      <ellipse class="muscle-highlight-secondary" cx="-7" cy="-2" rx="14" ry="12" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />

      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
          <ellipse class="muscle-highlight-secondary" cx="0" cy="12" rx="9" ry="17" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none" />

          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

              <g transform="translate(0,62)">
                <path d="M -10 -9 Q -18 0 -10 9 L 5 9 Q 13 9 13 0 Q 13 -9 5 -9 Z" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round" />
                <rect x="-5" y="-11" width="10" height="22" rx="5" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" />
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
