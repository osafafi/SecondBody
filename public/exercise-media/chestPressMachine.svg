<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Chest Press Machine</title>
  <desc>A person sits upright against the pad of a chest press machine with the handles level with the middle of the chest. They press the handles horizontally forward until the arms are nearly straight, pause while keeping the shoulders set back, then return slowly until the hands are level with the chest.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .torso { transform: rotate(5deg); }
    .upper-arm { transform: rotate(-45deg); }
    .forearm { transform: rotate(-88deg); }
    .press-arm { transform: rotate(90deg) scaleY(1.07); }

    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }

    .motion-trail { opacity: 0.5; }

    @media (prefers-reduced-motion: no-preference) {
      .upper-arm { animation: upperArmPress 3s ease-in-out infinite; }
      .forearm { animation: forearmPress 3s ease-in-out infinite; }
      .press-arm { animation: machinePress 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes upperArmPress {
        0% { transform: rotate(-45deg); }
        42% { transform: rotate(-87deg); }
        55% { transform: rotate(-87deg); }
        100% { transform: rotate(-45deg); }
      }

      @keyframes forearmPress {
        0% { transform: rotate(-88deg); }
        42% { transform: rotate(-5deg); }
        55% { transform: rotate(-5deg); }
        100% { transform: rotate(-88deg); }
      }

      @keyframes machinePress {
        0% { transform: rotate(90deg) scaleY(1.07); }
        42% { transform: rotate(90deg) scaleY(0.71); }
        55% { transform: rotate(90deg) scaleY(0.71); }
        100% { transform: rotate(90deg) scaleY(1.07); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="323" y="112" width="25" height="240" rx="8"/>
    <rect x="291" y="343" width="76" height="9" rx="4"/>
    <rect x="109" y="142" width="22" height="116" rx="9" transform="rotate(5 120 258)"/>
    <rect x="73" y="249" width="118" height="18" rx="9"/>
    <rect x="91" y="267" width="24" height="85" rx="6"/>
    <circle cx="336" cy="172" r="13"/>
    <circle cx="336" cy="172" r="4" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
  </g>

  <g transform="translate(336,172)">
    <g class="segment press-arm">
      <line x1="0" y1="0" x2="0" y2="100" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </g>
  </g>

  <path class="motion-trail" d="M 235 139 Q 260 132 287 139" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M 297 143 L 282 148 L 286 132 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>

  <g transform="translate(130,255)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-78)">
      <rect x="-14" y="-12" width="28" height="112" rx="14"/>
      <g transform="translate(0,88)">
        <g transform="rotate(35)">
          <rect x="-11" y="-10" width="22" height="104" rx="11"/>
          <g transform="translate(0,84)">
            <g transform="rotate(43)">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(130,255)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-primary" cx="13" cy="-65" rx="11" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>

      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse class="muscle-highlight-secondary" cx="2" cy="3" rx="9" ry="11" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <ellipse class="muscle-highlight-secondary" cx="-2" cy="31" rx="7" ry="20" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>

          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>

              <g transform="translate(0,62)">
                <rect x="-14" y="-10" width="34" height="8" rx="4" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round"/>
                <rect x="-11" y="4" width="31" height="8" rx="4" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
