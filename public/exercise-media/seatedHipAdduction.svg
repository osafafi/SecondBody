<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Seated Hip Adduction</title>
  <desc>A person sits upright in a hip adduction machine viewed from the front. They begin with the knees comfortably apart against two inner-knee pads, squeeze the knees together, hold briefly, then return slowly under control. The inner thighs glow as the knees close.</desc>
  <style>
    .segment {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .left-thigh { transform: rotate(35deg); }
    .right-thigh { transform: rotate(-35deg); }
    .left-shin { transform: rotate(-35deg); }
    .right-shin { transform: rotate(35deg); }
    .muscle-highlight-primary {
      opacity: 0.85;
      filter: blur(4px);
    }
    .motion-trail { opacity: 0.5; }
    @media (prefers-reduced-motion: no-preference) {
      .left-thigh { animation: leftThighAdduct 3s ease-in-out infinite; }
      .right-thigh { animation: rightThighAdduct 3s ease-in-out infinite; }
      .left-shin { animation: leftShinAdduct 3s ease-in-out infinite; }
      .right-shin { animation: rightShinAdduct 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .motion-trail { animation: adductorGlow 3s ease-in-out infinite; }
      @keyframes leftThighAdduct {
        0% { transform: rotate(35deg); }
        42% { transform: rotate(-7deg); }
        55% { transform: rotate(-7deg); }
        100% { transform: rotate(35deg); }
      }
      @keyframes rightThighAdduct {
        0% { transform: rotate(-35deg); }
        42% { transform: rotate(7deg); }
        55% { transform: rotate(7deg); }
        100% { transform: rotate(-35deg); }
      }
      @keyframes leftShinAdduct {
        0% { transform: rotate(-35deg); }
        42% { transform: rotate(7deg); }
        55% { transform: rotate(7deg); }
        100% { transform: rotate(-35deg); }
      }
      @keyframes rightShinAdduct {
        0% { transform: rotate(35deg); }
        42% { transform: rotate(-7deg); }
        55% { transform: rotate(-7deg); }
        100% { transform: rotate(35deg); }
      }
      @keyframes adductorGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" stroke-linecap="round"/>
    <rect x="142" y="82" width="116" height="142" rx="16"/>
    <rect x="118" y="202" width="164" height="22" rx="10"/>
    <rect x="136" y="220" width="16" height="132" rx="6"/>
    <rect x="248" y="220" width="16" height="132" rx="6"/>
    <rect x="303" y="132" width="48" height="220" rx="8"/>
    <rect x="312" y="151" width="30" height="22" rx="4"/>
    <rect x="312" y="179" width="30" height="22" rx="4"/>
    <rect x="312" y="207" width="30" height="22" rx="4"/>
    <rect x="312" y="235" width="30" height="22" rx="4"/>
    <circle cx="115" cy="211" r="7"/>
    <circle cx="285" cy="211" r="7"/>
    <path d="M115 211 L145 250" fill="none" stroke-linecap="round"/>
    <path d="M285 211 L255 250" fill="none" stroke-linecap="round"/>
  </g>
  <path class="motion-trail" d="M118 268 Q146 254 174 258" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M282 268 Q254 254 226 258" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9"/>
  <path class="motion-trail" d="M181 258 L166 250 L168 266 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <path class="motion-trail" d="M219 258 L234 250 L232 266 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none"/>
  <g fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(182,210)">
      <g class="segment left-thigh">
        <rect x="-14" y="-12" width="28" height="84" rx="14"/>
        <ellipse class="muscle-highlight-primary" cx="7" cy="28" rx="8" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <g transform="translate(0,60)">
          <rect x="4" y="-17" width="18" height="34" rx="7" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2"/>
          <g class="segment left-shin">
            <rect x="-11" y="-10" width="22" height="104" rx="11"/>
            <g transform="translate(0,84)">
              <path d="M-12 -8 C-12 -15 -6 -18 0 -18 C7 -18 13 -13 16 -5 L20 6 C21 10 17 13 11 13 L-10 13 C-15 13 -17 9 -16 4 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(218,210)">
      <g class="segment right-thigh">
        <rect x="-14" y="-12" width="28" height="84" rx="14"/>
        <ellipse class="muscle-highlight-primary" cx="-7" cy="28" rx="8" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
        <g transform="translate(0,60)">
          <rect x="-22" y="-17" width="18" height="34" rx="7" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2"/>
          <g class="segment right-shin">
            <rect x="-11" y="-10" width="22" height="104" rx="11"/>
            <g transform="translate(0,84)">
              <path d="M12 -8 C12 -15 6 -18 0 -18 C-7 -18 -13 -13 -16 -5 L-20 6 C-21 10 -17 13 -11 13 L10 13 C15 13 17 9 16 4 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(200,210)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <path d="M-18 12 C-25 -18 -26 -68 -22 -91 Q-20 -99 -11 -99 L11 -99 Q20 -99 22 -91 C26 -68 25 -18 18 12 Z"/>
    <rect x="-9" y="-124" width="18" height="31" rx="8"/>
    <path d="M0 -163 C13 -163 22 -153 22 -140 C22 -127 13 -117 0 -117 C-13 -117 -22 -127 -22 -140 C-22 -153 -13 -163 0 -163 Z"/>
    <g transform="translate(-17,-91) rotate(11)">
      <rect x="-11" y="-11" width="22" height="89" rx="11"/>
      <g transform="translate(0,67) rotate(34)">
        <rect x="-9" y="-9" width="18" height="80" rx="9"/>
        <circle cx="0" cy="62" r="9"/>
      </g>
    </g>
    <g transform="translate(17,-91) rotate(-11)">
      <rect x="-11" y="-11" width="22" height="89" rx="11"/>
      <g transform="translate(0,67) rotate(-34)">
        <rect x="-9" y="-9" width="18" height="80" rx="9"/>
        <circle cx="0" cy="62" r="9"/>
      </g>
    </g>
  </g>
</svg>
