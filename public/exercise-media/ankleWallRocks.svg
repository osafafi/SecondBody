<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Ankle Wall Rocks</title>
  <desc>A person stands in profile with the front foot flat near a wall and the knee nearly straight. They slowly drive the knee forward over the middle toes until it touches the wall, keeping the heel firmly on the floor, then rock back to the start. The calf glows as the ankle flexes.</desc>

  <style>
    .segment,
    .hip-shift {
      transform-box: view-box;
      transform-origin: 0 0;
    }

    .hip-shift { transform: translate(0px, 0px); }
    .torso { transform: rotate(6deg); }
    .thigh { transform: rotate(-35deg); }
    .shin { transform: rotate(20deg); }
    .foot { transform: rotate(-75deg); }
    .upper-arm { transform: rotate(8deg); }
    .forearm { transform: rotate(-5deg); }

    .muscle-highlight-primary {
      opacity: 0.85;
      filter: blur(4px);
    }

    .motion-trail { opacity: 0.5; }

    @media (prefers-reduced-motion: no-preference) {
      .hip-shift { animation: bodyRock 3s ease-in-out infinite; }
      .torso { animation: torsoRock 3s ease-in-out infinite; }
      .thigh { animation: thighRock 3s ease-in-out infinite; }
      .shin { animation: shinRock 3s ease-in-out infinite; }
      .foot { animation: footRock 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .motion-trail { animation: muscleGlow 3s ease-in-out infinite; }

      @keyframes bodyRock {
        0% { transform: translate(0px, 0px); }
        42% { transform: translate(48px, 34px); }
        55% { transform: translate(48px, 34px); }
        100% { transform: translate(0px, 0px); }
      }

      @keyframes torsoRock {
        0% { transform: rotate(6deg); }
        42% { transform: rotate(8deg); }
        55% { transform: rotate(8deg); }
        100% { transform: rotate(6deg); }
      }

      @keyframes thighRock {
        0% { transform: rotate(-35deg); }
        42% { transform: rotate(-55deg); }
        55% { transform: rotate(-55deg); }
        100% { transform: rotate(-35deg); }
      }

      @keyframes shinRock {
        0% { transform: rotate(20deg); }
        42% { transform: rotate(90deg); }
        55% { transform: rotate(90deg); }
        100% { transform: rotate(20deg); }
      }

      @keyframes footRock {
        0% { transform: rotate(-75deg); }
        42% { transform: rotate(-125deg); }
        55% { transform: rotate(-125deg); }
        100% { transform: rotate(-75deg); }
      }

      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    }
  </style>

  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352" />
    <line x1="304" y1="58" x2="304" y2="352" />
    <path d="M 304 72 L 319 62 M 304 102 L 319 92 M 304 132 L 319 122 M 304 162 L 319 152 M 304 192 L 319 182 M 304 222 L 319 212 M 304 252 L 319 242 M 304 282 L 319 272 M 304 312 L 319 302 M 304 342 L 319 332" fill="none" />
  </g>

  <path class="motion-trail" d="M 226 251 Q 258 248 286 266" fill="none" stroke="var(--muscle-motion-trail, #7C5CFF)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" />
  <path class="motion-trail" d="M 297 274 L 280 272 L 288 258 Z" fill="var(--muscle-motion-trail, #7C5CFF)" stroke="none" />

  <g transform="translate(168,194)">
    <g class="hip-shift">
      <g>
        <g class="segment thigh">
          <rect x="-14" y="-14" width="28" height="116" rx="14" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

          <g transform="translate(0,88)">
            <g class="segment shin">
              <rect x="-11" y="-11" width="22" height="106" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
              <ellipse class="muscle-highlight-primary" cx="3" cy="38" rx="8" ry="25" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none" />

              <g transform="translate(0,84)">
                <g class="segment foot">
                  <path d="M -5 -10 L -5 29 Q -5 40 5 40 L 10 40 Q 14 40 14 34 L 14 3 Q 14 -7 5 -10 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>

      <g class="segment torso">
        <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

        <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

        <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

        <g transform="translate(0,-96)">
          <g class="segment upper-arm">
            <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />

            <g transform="translate(0,67)">
              <g class="segment forearm">
                <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round" />
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
