<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="exerciseMediaTitle">
  <title id="exerciseMediaTitle">Stationary Bike, Easy</title>
  <desc>A person sits upright on a stationary bike and pedals at an easy pace. The near knee begins bent at the top of the pedal stroke, then the leg extends with a slight knee bend at the bottom before completing the revolution.</desc>
  <style>
    .segment,
    .crank,
    .pedal {
      transform-box: view-box;
      transform-origin: 0 0;
    }
    .torso { transform: rotate(4deg); }
    .upper-arm { transform: rotate(-55deg); }
    .forearm { transform: rotate(-25deg); }
    .thigh { transform: rotate(-68deg); }
    .shin { transform: rotate(115deg); }
    .foot { transform: rotate(-47deg); }
    .crank { transform: rotate(0deg); }
    .pedal { transform: rotate(0deg); }
    .muscle-highlight-primary,
    .muscle-highlight-secondary {
      opacity: 0.85;
      filter: blur(4px);
    }
    @media (prefers-reduced-motion: no-preference) {
      .thigh { animation: thighCycle 3s ease-in-out infinite; }
      .shin { animation: shinCycle 3s ease-in-out infinite; }
      .foot { animation: footCycle 3s ease-in-out infinite; }
      .crank { animation: crankCycle 3s ease-in-out infinite; }
      .pedal { animation: pedalCycle 3s ease-in-out infinite; }
      .muscle-highlight-primary,
      .muscle-highlight-secondary { animation: muscleGlow 3s ease-in-out infinite; }
      @keyframes thighCycle {
        0% { transform: rotate(-68deg); }
        21% { transform: rotate(-63deg); }
        42% { transform: rotate(-35deg); }
        55% { transform: rotate(-35deg); }
        78% { transform: rotate(-40deg); }
        100% { transform: rotate(-68deg); }
      }
      @keyframes shinCycle {
        0% { transform: rotate(115deg); }
        21% { transform: rotate(82deg); }
        42% { transform: rotate(56deg); }
        55% { transform: rotate(56deg); }
        78% { transform: rotate(87deg); }
        100% { transform: rotate(115deg); }
      }
      @keyframes footCycle {
        0% { transform: rotate(-47deg); }
        21% { transform: rotate(-19deg); }
        42% { transform: rotate(-21deg); }
        55% { transform: rotate(-21deg); }
        78% { transform: rotate(-47deg); }
        100% { transform: rotate(-47deg); }
      }
      @keyframes crankCycle {
        0% { transform: rotate(0deg); }
        21% { transform: rotate(90deg); }
        42% { transform: rotate(180deg); }
        55% { transform: rotate(180deg); }
        78% { transform: rotate(270deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pedalCycle {
        0% { transform: rotate(0deg); }
        21% { transform: rotate(-90deg); }
        42% { transform: rotate(-180deg); }
        55% { transform: rotate(-180deg); }
        78% { transform: rotate(-270deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes muscleGlow {
        0% { opacity: 0.3; }
        21% { opacity: 0.55; }
        42% { opacity: 0.85; }
        55% { opacity: 0.85; }
        78% { opacity: 0.5; }
        100% { opacity: 0.3; }
      }
    }
  </style>
  <g fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="24" y1="352" x2="376" y2="352"/>
    <rect x="126" y="343" width="181" height="9" rx="4"/>
    <circle cx="225" cy="315" r="32"/>
    <circle cx="225" cy="315" r="7" fill="var(--muscle-equipment-stroke, #5A5385)" stroke="none"/>
    <path d="M 225 315 L 197 194 L 282 226 Z" fill="none"/>
    <path d="M 197 194 L 282 226 L 225 315" fill="none"/>
    <path d="M 282 226 L 298 163 L 318 145" fill="none"/>
    <path d="M 282 226 L 294 343" fill="none"/>
    <path d="M 225 315 L 168 343" fill="none"/>
    <rect x="174" y="187" width="50" height="12" rx="6"/>
    <path d="M 307 145 L 328 145 L 334 151" fill="none"/>
  </g>
  <g transform="translate(225,315)">
    <g class="crank">
      <line x1="0" y1="0" x2="0" y2="-30" fill="none" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(0,-30)">
        <g class="pedal">
          <rect x="-14" y="-4" width="28" height="8" rx="4" fill="var(--muscle-equipment-fill, #241F42)" stroke="var(--muscle-equipment-stroke, #5A5385)" stroke-width="2"/>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(200,190)" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round">
    <g class="segment thigh">
      <rect x="-14" y="-14" width="28" height="116" rx="14"/>
      <ellipse class="muscle-highlight-primary" cx="-5" cy="43" rx="8" ry="27" fill="var(--muscle-highlight-primary, #A855F7)" stroke="none"/>
      <ellipse class="muscle-highlight-secondary" cx="6" cy="49" rx="6" ry="23" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <g transform="translate(0,88)">
        <g class="segment shin">
          <rect x="-11" y="-11" width="22" height="106" rx="11"/>
          <ellipse class="muscle-highlight-secondary" cx="2" cy="45" rx="8" ry="24" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
          <g transform="translate(0,84)">
            <g class="segment foot">
              <path d="M -10 -12 L 30 -12 Q 40 -12 40 -3 L 40 5 Q 40 11 31 11 L -10 11 Q -15 11 -15 0 Z"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
  <g transform="translate(200,190)">
    <g class="segment torso">
      <rect x="-9" y="-124" width="21" height="34" rx="8" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -18 12 C -26 -20 -28 -70 -22 -92 Q -19 -99 -10 -99 L 13 -99 Q 23 -99 25 -91 C 29 -66 25 -18 18 12 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <ellipse class="muscle-highlight-secondary" cx="-14" cy="-3" rx="12" ry="14" fill="var(--muscle-highlight-secondary, #3D8BFF)" stroke="none"/>
      <path d="M 3 -162 C 14 -162 23 -153 23 -142 C 23 -137 26 -134 27 -131 C 28 -129 26 -128 23 -128 C 22 -122 14 -118 3 -118 C -9 -118 -17 -127 -17 -140 C -17 -152 -9 -162 3 -162 Z" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0,-96)">
        <g class="segment upper-arm">
          <rect x="-11" y="-11" width="22" height="89" rx="11" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
          <g transform="translate(0,67)">
            <g class="segment forearm">
              <rect x="-9" y="-9" width="18" height="80" rx="9" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3" stroke-linejoin="round"/>
              <g transform="translate(0,62)">
                <rect x="-8" y="-7" width="18" height="14" rx="7" fill="var(--muscle-body-fill, #1C1934)" stroke="var(--muscle-body-stroke, #4A4470)" stroke-width="3"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
